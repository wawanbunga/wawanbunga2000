function prefillMatunFields(t, pi, tglVal) {
  const d = tglVal ? parseInt(tglVal.split('-')[2]) : 0;
  if(!d) return;
  const kL = `MT-${currentMonth}-${t}-${d}-${pi}`;
  const kP = `MT-${currentMonth}-${t}-${d}-${pi}-pek`;
  const kK = `MT-${currentMonth}-${t}-${d}-${pi}-ket`;
  const el = document.getElementById('mt-luas'); if(el) el.value = matunData[t][kL]||'';
  const ep = document.getElementById('mt-pek');  if(ep) ep.value = matunData[t][kP]||'';
  const ek = document.getElementById('mt-ket');  if(ek) ek.value = matunData[t][kK]||'';
}

// ── UPDATE MATUN SUMMARY (tanpa full re-render) ───────────
function updateMatunSummary(t) {
  const days = getDays(currentMonth);
  const conf = MATUN_CONF[t];
  const setup = bedengSetup[t];
  const np = setup.pekerja.length;
  const hc = conf.hybridCount;
  const kap = setup.kapasitas||0;
  const lastD = days[days.length-1].d;

  function getAkumLuas(pi, upToD) {
    let tot=0;
    for(let d=1;d<=upToD;d++) tot+=parseFloat(matunData[t][`MT-${currentMonth}-${t}-${d}-${pi}`]||0);
    return tot;
  }
  function getSisaTotal(upToD) {
    let totAkum=0;
    for(let pi=0;pi<np;pi++) totAkum+=getAkumLuas(pi,upToD);
    return kap-totAkum;
  }

  const sisaTot = getSisaTotal(lastD);
  const sisPct = kap>0 ? Math.round((sisaTot/kap)*100) : 0;

  // Update summary bar
  const sumEl = document.getElementById(`matun-sum-${t}`);
  if(sumEl) {
    sumEl.innerHTML = `<span>Kapasitas: <strong>${kap}</strong></span>
      <span>Sisa Bedeng: <strong style="color:var(--or)">${sisaTot}</strong></span>
      <span>Sisa: <strong style="color:${sisPct<20?'#c0392b':sisPct<50?'#b8820f':'#1a6b3c'}">${sisPct}%</strong></span>`;
  }
}

}

function saveMO(){
  if(CURRENT_LOC!=null && !canEditLoc(CURRENT_LOC)){ hideMO(); toast('🔒 Anda hanya punya akses lihat di sini'); return; }
  const mc=moCtx;
  if(mc.type==='kr-stop'){ krSimpanStop(); return; }
  if(mc.type==='kr-form'){ krSimpanForm(); return; }
  // ── Validasi format jam: 8:00 atau 8 ──
  if(mc.type==='absen'||mc.type==='absen-sg'||mc.type==='absen-batch'||mc.type==='absen-batch-sg'){
    const batch=mc.type.indexOf('batch')>=0;
    const jenis=document.getElementById(batch?'mo-jenis2':'mo-jenis');
    if(jenis && jenis.value==='jam'){
      const inp=document.getElementById(batch?'mo-jam2':'mo-jam');
      const raw=inp?inp.value.trim():'';
      if(raw===''){ if(batch){ toast('❌ Isi jam kerja, tulis 8:00 atau 8'); return; } }
      else { const r=krParseJam(raw); if(!r){ toast('❌ Format jam salah. Tulis 8:00 atau 8'); if(inp) inp.focus(); return; } inp.value=r.teks; }
    }
  } else if(mc.type==='lembur'||mc.type==='lembur-sg'||mc.type==='lembur-batch'||mc.type==='lembur-batch-sg'){
    const batch=mc.type.indexOf('batch')>=0;
    const inp=document.getElementById(batch?'mo-lem-b':'mo-lem');
    const raw=inp?inp.value.trim():'';
    if(raw===''){ if(batch){ toast('❌ Isi lembur dalam menit'); return; } }
    else {
      const n=parseInt(raw,10);
      if(!/^\d+$/.test(raw) || isNaN(n) || n<=0 || n>720){ toast('❌ Isi angka menit yang benar (maksimal 720)'); if(inp) inp.focus(); return; }

  if(mc.type==='absen'){

  } else if(mc.type==='absen-batch'){

    lemburDataSG[mc.key]=document.getElementById('mo-lem').value;hideMO();renderLemburSG();saveLemburSG();toast('✅ Lembur disimpan');
  } else if(mc.type==='lembur-batch-sg'){

    const d=tglVal?parseInt(tglVal.split('-')[2]):0;

  } else if(mc.type==='lembur-rate-sg'){

      nama:document.getElementById('jl-nama').value,

  } else if(mc.type==='matun'){
    const tglVal = document.getElementById('mt-tgl').value;

    if(pek)  matunData[t][kP]=pek;  else delete matunData[t][kP];
    if(ket)  matunData[t][kK]=ket;  else delete matunData[t][kK];
    hideMO();renderMatun(t);saveMatun();toast('✅ Data matun disimpan');
  } else if(mc.type==='jt-tambah'){
    const lok=mc.lok;
    const blk=document.getElementById('jt-blk-sel').value;
    const conf=JT_CONF[lok];
    const row={

      warna: document.getElementById('jt-warna').value,
      jTanam: document.getElementById('jt-jtanam').value,

      pBedeng: document.getElementById('jt-pbedeng').value,

    const lok=mc.lok;

    jtSubs[lok][blk].push(pos);
    jtSubs[lok][blk]=[...new Set(jtSubs[lok][blk])].sort((a,b)=>a-b);

    const name=document.getElementById('ak-name').value.trim();
    const uname=document.getElementById('ak-user').value.trim().toLowerCase();

    const role=document.getElementById('ak-role').value;
    if(!name){toast('❌ Nama wajib diisi');return;}
    if(!uname){toast('❌ Username wajib diisi');return;}
    if(pass.length<4){toast('❌ Password minimal 4 karakter');return;}
    if(USERS.find(x=>x.username===uname)){toast('❌ Username sudah dipakai');return;}
    USERS.push({id:newUserId(),name,role,username:uname,pass});
    hideMO();renderAkunAdmin();saveUsers();toast('✅ Akun ditambahkan');
  } else if(mc.type==='edit-akun'){
    const u=USERS.find(x=>x.id===mc.uid);if(!u)return;
    const isSelf=u.id===CU.id;
    const name=document.getElementById('ak-name').value.trim();
    const uname=document.getElementById('ak-user').value.trim().toLowerCase();
    const pass=document.getElementById('ak-pass').value;
    const roleEl=document.getElementById('ak-role');
    if(!name){toast('❌ Nama wajib diisi');return;}
    if(!uname){toast('❌ Username wajib diisi');return;}
    const dupUser=USERS.find(x=>x.username===uname && x.id!==mc.uid);
    if(dupUser){toast('❌ Username sudah dipakai akun lain');return;}
    if(pass && pass.length<4){toast('❌ Password minimal 4 karakter');return;}
    u.name=name; u.username=uname;
    if(pass) u.pass=pass;
    if(!isSelf && roleEl) u.role=roleEl.value;
    if(isSelf){ CU.name=name; CU.username=uname; if(pass)CU.pass=pass;
      document.getElementById('tb-sub').textContent='Selamat datang, '+CU.name; }
    hideMO();renderAkunAdmin();saveUsers();toast('✅ Akun diperbarui');
  }

const PX = {
  // CSS dasar untuk semua dokumen print
  base: `<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:10px;color:#1a0e05;background:#fff}

    .sub{font-size:9px;color:#7a4020;margin-bottom:10px}
    .header{display:flex;justify-content:space-between;align-items:flex-start;
      border-bottom:2px solid #C2500A;padding-bottom:8px;margin-bottom:10px}
    .header-left{}
    .header-right{text-align:right;font-size:9px;color:#7a4020}
    table{width:100%;border-collapse:collapse;font-size:9px;margin-bottom:10px}
    th{background:#C2500A;color:#fff;padding:4px 5px;text-align:center;font-weight:700;font-size:8px;white-space:nowrap}

    td.r{text-align:right}td.c{text-align:center}
    tr:nth-child(even) td{background:#fff8f5}
    tr.total td{background:#FFF3EB;font-weight:700;color:#C2500A}
    .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:8px;font-weight:700}
    .b-gr{background:#edf7f1;color:#15803D}.b-rd{background:#fef2f2;color:#c0392b}
    .b-or{background:#FFF3EB;color:#C2500A}.b-bl{background:#eff6ff;color:#1D4ED8}
    .summary{background:#FFF3EB;border-radius:6px;padding:6px 10px;margin-bottom:8px;
      display:flex;gap:20px;flex-wrap:wrap;font-size:9px}
    .summary span strong{color:#C2500A}
    .section{margin-bottom:12px}
    .page-break{page-break-after:always}
    .kas-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #e8d5c0;font-size:9px}
    .kas-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    @media print{
      @page{size:A4 landscape;margin:12mm}
      body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>`,

  open(title, landscape=true) {
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${title}</title>${PX.base}</head>
    <body>`;
  },

  header(judul, sub) {
    const now = new Date();
    const tgl = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
    return `<div class="header">
      <div class="header-left">
        <h1>🌸 Wawan Bunga</h1>
        <h2>${judul}</h2>

      </div>
      <div class="header-right">Dicetak: ${tgl}<br>Oleh: ${CU?.name||'-'}</div>
    </div>`;
  },

  close() { return `</body></html>`; },

  doOpen(html) {
    const w = window.open('','_blank','width=900,height=700');
    if(!w){toast('❌ Popup diblokir browser');return;}
    w.document.write(html);
    w.document.close();
    w.onload = ()=>{ w.focus(); w.print(); };
  }
};

// ── PRINT ABSENSI ─────────────────────────────────────────
function printAbsensi() {
  const days = getDays(currentMonth);
  const [y,m] = currentMonth.split('-').map(Number);
  const mn = monthN[m];

  let tHead = `<tr><th class="l" style="min-width:70px">Nama</th>`;
  days.forEach(({d,day})=>{
    const we=day===0||day===6;
    tHead+=`<th style="${we?'background:rgba(0,0,0,.45)':''}min-width:14px">${d}</th>`;
  });
  tHead+=`<th>Jam</th></tr>`;

  const STATUS_CLR={I:'#1D4ED8',S:'#15803D',A:'#c0392b',B:'#9333EA'};
  let tBody='';
  karyawan.forEach((kr,ki)=>{if(!krAktif(kr,currentMonth))return;
    let tot=0;
    let row=`<tr><td>${kr.nama}</td>`;
    days.forEach(({d,day})=>{
      const k=`${currentMonth}-${karyawan[ki].id}-${d}`;
      const v=(absenData[k]||'').toUpperCase();
      const we=day===0||day===6;
      let bg=we?'background:#f5f5f5;':'';
      let clr='';
      if(STATUS_CLR[v]){bg+=`background:${STATUS_CLR[v]}22;`;clr=`color:${STATUS_CLR[v]};font-weight:700;`;}
      if(v&&!absenColors[v]){tot+=parseTime(v);}
      row+=`<td class="c" style="${bg+clr}font-size:8px">${v||''}</td>`;
    });
    row+=`<td class="c" style="font-weight:700;color:#C2500A">${fmtMins(tot)||'-'}</td></tr>`;
    tBody+=row;
  });

  const html = PX.open(`Absensi ${mn} ${y}`)
    + PX.header(`Absensi Karyawan — ${mn} ${y}`, `Bulan: ${mn} ${y} · Total Karyawan: ${krJumlahAktif(karyawan,currentMonth)}`)
    + `<div class="summary">
        <span>Bulan: <strong>${mn} ${y}</strong></span>
        <span>Karyawan: <strong>${krJumlahAktif(karyawan,currentMonth)} orang</strong></span>
        <span>I=Ijin · S=Sakit · A=Tanpa Ket · B=Diliburkan</span>
      </div>
      <table style="font-size:8px"><thead>${tHead}</thead><tbody>${tBody}</tbody></table>`
    + PX.close();
  PX.doOpen(html);
}

// ── PRINT GAJI ────────────────────────────────────────────
function printGaji() {
  const days=getDays(currentMonth);const wks=getWeeks(days);
  const [y,m]=currentMonth.split('-').map(Number); const mn=monthN[m];

  const krData=karyawan.map((kr,ki)=>({kr,ki})).filter(({kr})=>krAktif(kr,currentMonth)).map(({kr,ki})=>{
    let totalGaji=0;
    const weeks=wks.map(wk=>{
      let tM=0,tL=0;
      wk.forEach(d=>{
        const v=(absenData[`${currentMonth}-${karyawan[ki].id}-${d}`]||'').toUpperCase();
        if(v&&!absenColors[v])tM+=parseTime(v);
        tL+=parseInt(lemburData[`L-${currentMonth}-${karyawan[ki].id}-${d}`]||0);
      });
      const gP=Math.round(krGaji(kr,currentMonth)*(tM/480));
      const gL=Math.round(tL*(rateLembur(currentMonth)/60));
      totalGaji+=gP+gL;
      return {gP,gL};
    });
    return {kr,weeks,totalGaji};
  });
  const grandTotal=krData.reduce((s,d)=>s+d.totalGaji,0);

  let wkH=wks.map((wk,i)=>`<th colspan="2">Minggu ${i+1} (${wk[0]}-${wk[wk.length-1]})</th>`).join('');
  let wkSub=wks.map(()=>`<th>Pokok</th><th>Lembur</th>`).join('');
  let tBody='';
  krData.forEach(({kr,weeks,totalGaji})=>{
    tBody+=`<tr>
      <td>${kr.nama} <span class="badge ${kr.tipe==='bulanan'?'b-bl':'b-or'}">${kr.tipe==='bulanan'?'Bln':'Mgg'}</span></td>
      <td class="r" style="font-weight:700;color:#C2500A">${fmtRp(totalGaji)}</td>
      ${weeks.map(w=>`<td class="r">${w.gP?fmtRp(w.gP):'-'}</td><td class="r" style="color:#1D4ED8">${w.gL?fmtRp(w.gL):'-'}</td>`).join('')}
    </tr>`;
  });

  const html = PX.open(`Gaji ${mn} ${y}`)
    + PX.header(`Laporan Gaji — ${mn} ${y}`, `*Lembur = Rp${rateLembur(currentMonth).toLocaleString('id-ID')}/jam · Gaji pokok = (jam/8jam)×gaji harian`)
    + `<div class="summary"><span>Total Bulan: <strong>${fmtRp(grandTotal)}</strong></span>
        <span>Karyawan: <strong>${krJumlahAktif(karyawan,currentMonth)} orang</strong></span></div>
      <table>
        <thead>
          <tr><th class="l" rowspan="2">Nama</th><th rowspan="2">Total Bulan</th>${wkH}</tr>
          <tr>${wkSub}</tr>
        </thead>
        <tbody>${tBody}</tbody>
        <tfoot>
          <tr class="total">
            <td>TOTAL</td><td class="r">${fmtRp(grandTotal)}</td>
            ${wks.map((_,wi)=>{
              const wT=krData.reduce((s,{weeks})=>s+weeks[wi].gP,0);
              const lT=krData.reduce((s,{weeks})=>s+weeks[wi].gL,0);
              return `<td class="r">${fmtRp(wT)}</td><td class="r">${lT?fmtRp(lT):'-'}</td>`;
            }).join('')}
          </tr>
        </tfoot>
      </table>`
    + PX.close();
  PX.doOpen(html);
}

// ── PRINT LEMBUR ──────────────────────────────────────────
function printLembur() {
  const days=getDays(currentMonth);
  const [y,m]=currentMonth.split('-').map(Number); const mn=monthN[m];

  let tHead=`<tr><th class="l">Nama</th>`;
  days.forEach(({d,day})=>{const we=day===0||day===6;tHead+=`<th style="${we?'background:rgba(0,0,0,.45)':''}font-size:8px">${d}</th>`;});
  tHead+=`<th>Total</th></tr>`;

  let tBody='';
  karyawan.forEach((kr,ki)=>{if(!krAktif(kr,currentMonth))return;
    let tot=0;
    let row=`<tr><td>${kr.nama}</td>`;
    days.forEach(({d})=>{
      const k=`L-${currentMonth}-${karyawan[ki].id}-${d}`;const v=lemburData[k]||'';
      if(v)tot+=parseInt(v)||0;
      row+=`<td class="c" style="${v?'color:#C2500A;font-weight:700':''}">${v||''}</td>`;
    });
    row+=`<td class="c" style="font-weight:700;color:#C2500A">${tot||'-'}</td></tr>`;
    tBody+=row;
  });

  const html = PX.open(`Lembur ${mn} ${y}`)
    + PX.header(`Lembur Karyawan — ${mn} ${y}`, `Satuan: menit · Rp${rateLembur(currentMonth).toLocaleString('id-ID')}/jam`)
    + `<table style="font-size:8px"><thead>${tHead}</thead><tbody>${tBody}</tbody></table>`
    + PX.close();
  PX.doOpen(html);
}

// ── PRINT GAJI ────────────────────────────────────────────
function printGajiSG() {
  const days=getDays(currentMonth);const wks=getWeeks(days);
  const [y,m]=currentMonth.split('-').map(Number); const mn=monthN[m];

  const krData=karyawanSG.map((kr,ki)=>({kr,ki})).filter(({kr})=>krAktif(kr,currentMonth)).map(({kr,ki})=>{
    let totalGaji=0;
    const weeks=wks.map(wk=>{
      let tM=0,tL=0;
      wk.forEach(d=>{
        const v=(absenDataSG[`${currentMonth}-${karyawanSG[ki].id}-${d}`]||'').toUpperCase();
        if(v&&!absenColors[v])tM+=parseTime(v);
        tL+=parseInt(lemburDataSG[`L-${currentMonth}-${karyawanSG[ki].id}-${d}`]||0);
      });
      const gP=Math.round(krGaji(kr,currentMonth)*(tM/480));
      const gL=Math.round(tL*(rateLemburSG(currentMonth)/60));
      totalGaji+=gP+gL;
      return {gP,gL};
    });
    return {kr,weeks,totalGaji};
  });
  const grandTotal=krData.reduce((s,d)=>s+d.totalGaji,0);

  let wkH=wks.map((wk,i)=>`<th colspan="2">Minggu ${i+1} (${wk[0]}-${wk[wk.length-1]})</th>`).join('');
  let wkSub=wks.map(()=>`<th>Pokok</th><th>Lembur</th>`).join('');
  let tBody='';
  krData.forEach(({kr,weeks,totalGaji})=>{
    tBody+=`<tr>
      <td>${kr.nama} <span class="badge ${kr.tipe==='bulanan'?'b-bl':'b-or'}">${kr.tipe==='bulanan'?'Bln':'Mgg'}</span></td>
      <td class="r" style="font-weight:700;color:#C2500A">${fmtRp(totalGaji)}</td>
      ${weeks.map(w=>`<td class="r">${w.gP?fmtRp(w.gP):'-'}</td><td class="r" style="color:#1D4ED8">${w.gL?fmtRp(w.gL):'-'}</td>`).join('')}
    </tr>`;
  });

  const html = PX.open(`Gaji ${mn} ${y}`)
    + PX.header(`Laporan Gaji — ${mn} ${y}`, `*Lembur = Rp${rateLemburSG(currentMonth).toLocaleString('id-ID')}/jam · Gaji pokok = (jam/8jam)×gaji harian`)
    + `<div class="summary"><span>Total Bulan: <strong>${fmtRp(grandTotal)}</strong></span>
        <span>Karyawan: <strong>${krJumlahAktif(karyawanSG,currentMonth)} orang</strong></span></div>
      <table>
        <thead>
          <tr><th class="l" rowspan="2">Nama</th><th rowspan="2">Total Bulan</th>${wkH}</tr>
          <tr>${wkSub}</tr>
        </thead>
        <tbody>${tBody}</tbody>
        <tfoot>
          <tr class="total">
            <td>TOTAL</td><td class="r">${fmtRp(grandTotal)}</td>
            ${wks.map((_,wi)=>{
              const wT=krData.reduce((s,{weeks})=>s+weeks[wi].gP,0);
              const lT=krData.reduce((s,{weeks})=>s+weeks[wi].gL,0);
              return `<td class="r">${fmtRp(wT)}</td><td class="r">${lT?fmtRp(lT):'-'}</td>`;
            }).join('')}
          </tr>
        </tfoot>
      </table>`
    + PX.close();
  PX.doOpen(html);
}

// ── PRINT PANEN (3 tempat, 1 halaman) ─────────────────────
function printPanen() {
  const days=getDays(currentMonth);

  // Rekap gabungan 3 tempat
  let rekapH=`<tr><th class="l">Tanggal</th>
    ${bunga.map(b=>`<th>${b.split(' ')[0]}</th>`).join('')}
    <th>Total</th><th>Rusak T1</th><th>Rusak T2</th><th>Rusak T3</th></tr>`;

  let grandTot=0;const grandB=bunga.map(()=>0);
  let rekapB='';
  days.forEach(({d,day})=>{
    const bTot=bunga.map((_,bi)=>[1,2,3].reduce((s,t)=>s+parseInt(panenData[t]&&panenData[t][`P-${currentMonth}-${t}-${d}-${bi}`]||0),0));
    const rowTot=bTot.reduce((a,b)=>a+b,0);
    bTot.forEach((v,i)=>grandB[i]+=v); grandTot+=rowTot;
    const rusakT=[1,2,3].map(t=>parseInt(panenData[t]&&panenData[t][`P-${currentMonth}-${t}-${d}-rusak`]||0));
    if(!rowTot&&!rusakT.some(r=>r))return;
    const dayStr=['Min','Sen','Sel','Rab','Kam','Jum','Sab'][day];
    rekapB+=`<tr><td>${d} ${dayStr}</td>
      ${bTot.map(v=>`<td class="c" style="${v?'color:#C2500A;font-weight:700':''}">${v||''}</td>`).join('')}
      <td class="c" style="font-weight:700;color:#C2500A">${rowTot||''}</td>
      ${rusakT.map(r=>`<td class="c" style="${r?'color:#c0392b':''}">${r||''}</td>`).join('')}
    </tr>`;
  });
  rekapB+=`<tr class="total"><td>TOTAL</td>
    ${grandB.map(v=>`<td class="c">${v||''}</td>`).join('')}
    <td class="c">${grandTot}</td><td></td><td></td><td></td></tr>`;

  // Detail per tempat
  // LOKNAMA sudah didefinisikan secara global
  let detailHtml='';
  [1,2,3].forEach(t=>{
    let tH=`<tr><th class="l">Tanggal</th>${bunga.map(b=>`<th>${b.split(' ')[0]}</th>`).join('')}<th>Total</th><th>Rusak</th></tr>`;
    let tB=''; let tot=0;
    days.forEach(({d,day})=>{
      const bV=bunga.map((_,bi)=>parseInt(panenData[t]&&panenData[t][`P-${currentMonth}-${t}-${d}-${bi}`]||0));
      const rowT=bV.reduce((a,b)=>a+b,0);
      const rk=parseInt(panenData[t]&&panenData[t][`P-${currentMonth}-${t}-${d}-rusak`]||0);
      if(!rowT&&!rk)return;
      tot+=rowT;
      const dayStr=['Min','Sen','Sel','Rab','Kam','Jum','Sab'][day];
      tB+=`<tr><td>${d} ${dayStr}</td>
        ${bV.map(v=>`<td class="c" style="${v?'color:#C2500A':''}">${v||''}</td>`).join('')}
        <td class="c" style="font-weight:700;color:#C2500A">${rowT||''}</td>
        <td class="c" style="${rk?'color:#c0392b':''}">${rk||''}</td></tr>`;
    });
    detailHtml+=`<div class="section"><h2 style="color:#15803D;margin-bottom:4px">📍 ${LOKNAMA[t]} — Total: ${tot} tangkai</h2>
      <table><thead>${tH}</thead><tbody>${tB||`<tr><td colspan="${bunga.length+3}" style="text-align:center;color:#999;padding:8px">Belum ada data</td></tr>`}</tbody></table>
    </div>`;
  });

  const html = PX.open(`Panen ${mn} ${y}`)
    + PX.header(`Laporan Panen — ${mn} ${y}`, `Total seluruh tempat: ${grandTot} tangkai`)
    + `<div class="section">
        <h2>📊 Rekap Gabungan 3 Tempat</h2>
        <table><thead>${rekapH}</thead><tbody>${rekapB}</tbody></table>
      </div>
      <div class="page-break"></div>`
    + detailHtml
    + PX.close();
  PX.doOpen(html);
}

// Pastikan SEMUA blok di semua lokasi (kecuali Kalibanger yang pakai grid terpisah)
// selalu punya minimal 1 baris kosong siap-isi — supaya semua blok kelihatan sama
// formatnya (bukan cuma Blok A yang ada baris input, blok lain kosong melompong).
function jtNormalizeEmptyBlocks() {
  Object.keys(JT_CONF).forEach(lokKey => {
    const lok = parseInt(lokKey, 10);
    if (lok === 1) return; // Kalibanger: grid spreadsheet tersinkron (kalGrid), bukan jtData
    const conf = JT_CONF[lok];
    if (!jtData[lok]) jtData[lok] = {};
    conf.blok.forEach(blk => {
      if (!Array.isArray(jtData[lok][blk]) || jtData[lok][blk].length === 0) {
        jtData[lok][blk] = [{ id: jtNewId(), bdg:'', warna:'-', jTanam:'', kacang:'', pBedeng:'' }];
      }
    });
  });
}
jtNormalizeEmptyBlocks(); // jalan sekali di awal (sebelum Firebase connect / kalau offline)

function jtCompute(rows) {
  // Hitung total dari array rows
  let totJ=0, totK=0, totP=0, totB=0;
  rows.forEach(r => {
    totJ += parseFloat(r.jTanam||0);
    totK += parseFloat(r.kacang||0);
    totP += parseFloat(r.pBedeng||0);
    totB += parseFloat(r.bdg||0);
  });
  return {totJ, totK, totP, totB};
}

function jtComputeSection(rows, from, to) {
  // rows dari index from (inklusif) s.d. to (eksklusif)
  return jtCompute(rows.slice(from, to));
}

function jtWarnaSelect(id, val, style='') {
  return `<select id="${id}" style="width:100%;padding:2px 3px;border:1px solid var(--b);border-radius:5px;font-size:10px;background:#fff;${style}" onchange="jtOnChange()">
    ${JT_WARNA_OPTS.map(w=>`<option value="${w}"${w===(val||'-')?'selected':''}>${w}</option>`).join('')}
  </select>`;
}

      <i class="ti ${a.icon}" style="font-size:17px;width:20px;text-align:center;${a.danger?'color:#c0392b':'color:var(--or)'}"></i>${a.label}
    </button>`).join('')
    + `<button onclick="jtCloseRowMenu()" style="width:100%;padding:11px;margin-top:8px;background:var(--bg);
      border:1.5px solid var(--b);border-radius:var(--rs);font-weight:700;font-size:13px;color:var(--tm);cursor:pointer">Batal</button>`;
  document.getElementById('RM').classList.add('show');
}
function jtRunRowAction(i) {
  const a = rmActions[i];
  jtCloseRowMenu();
  if(!a) return;
  if(a.danger && !confirm(a.confirmMsg || 'Yakin mau lanjutkan?')) return;
  a.fn();
}
function jtCloseRowMenu(event) {
  if(event && event.target !== event.currentTarget) return;
  document.getElementById('RM').classList.remove('show');
}
function jtKebabBtn(title, actionsJs, styleOverride) {
  // actionsJs = string JS array literal (aman karena selalu kita yang generate)
  const st = styleOverride || 'background:#fdf3ea;border:1px solid #f0d9bd;color:#8a5a2a';
  return `<button onclick="jtOpenRowMenu('${title}', ${actionsJs})"
    style="${st};border-radius:6px;cursor:pointer;
    padding:3px 9px;font-size:14px;font-weight:900;line-height:1" title="Aksi baris">⋮</button>`;
}

// ── RENDER UTAMA ──────────────────────────────────────────
function renderJumlahTanaman(lok) {
  CURRENT_LOC = lok;
  if (lok === 1) { renderKalGrid(); return; } // Kalibanger pakai tampilan grid spreadsheet
  const conf = JT_CONF[lok];
  const hasK = conf.hasKacang;

  conf.blok.forEach(blk => {
    if (!jtData[lok][blk]) jtData[lok][blk] = [];
    if (!jtSubs[lok]) jtSubs[lok] = {};
    if (!jtSubs[lok][blk]) jtSubs[lok][blk] = [18, 33];
  });

  let html = `
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn-save" style="padding:8px 14px;font-size:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#1a6b3c,#1a8a4c);flex:1;min-width:110px"
      onclick="jtTambahBaris(${lok})">
      <i class="ti ti-plus"></i> Tambah Baris
    </button>
    <button class="btn-save" style="padding:8px 14px;font-size:12px;border:none;cursor:pointer;background:#f97316;flex:1;min-width:110px"
      onclick="jtTambahSubtotal(${lok})">
      <i class="ti ti-sum"></i> + Subtotal
    </button>
    <button class="btn-print" style="flex:1;min-width:80px;justify-content:center" onclick="jtPrint(${lok})"><i class="ti ti-printer"></i> Print</button>
  </div>
  <div style="font-size:11px;color:var(--tl);margin-bottom:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 10px">
    💡 Baris <span style="background:#f97316;color:#fff;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700">ORANGE</span> = subtotal. Ketuk <strong>⋮</strong> di kanan tiap baris untuk tambah baris (atas/bawah), tambah subtotal, atau hapus baris — di posisi mana saja.
  </div>

  <!-- Tabel blok -->
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1.5px solid #e0d0c0">
    <div id="jt-tbl-wrap-${lok}">
      ${jtRenderTblWrap(lok, conf, hasK)}
    </div>
  </div>`;

  html += jtBuildRekap(lok, conf, hasK);
  document.getElementById('MC').innerHTML = html;
  applyReadOnlyGuard();
}

// Router: Ngadikerso (3) pakai layout bertumpuk (A1→A2→A3 ke bawah, B di samping).
// Lokasi lain tetap pakai tabel semua blok side-by-side.
function jtRenderTblWrap(lok, conf, hasK) {
  if (lok === 3) return jtBuildNgadikersoLayout(lok, conf, hasK);
  return jtBuildAllBloksTable(lok, conf, hasK);
}

// ── Layout khusus Ngadikerso: semua blok (A1, A2, A3, B) ditumpuk 1 kolom penuh ke bawah ──
// (sebelumnya A1-A3 kiri & B kanan berdampingan, tapi karena tinggi baris tiap blok beda-beda,
//  barisnya jadi tidak sejajar dan keliatan "numpuk"/nabrak. Ditumpuk 1 kolom lebih aman & mudah dibaca.)
function jtBuildNgadikersoLayout(lok, conf, hasK) {
  const colors = ['#1a6b3c','#1a5c8a','#7C3AED','#b8820f'];
  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${jtBuildSingleBlokTable(lok,'A1',hasK,colors[0])}
    ${jtBuildSingleBlokTable(lok,'A2',hasK,colors[1])}
    ${jtBuildSingleBlokTable(lok,'A3',hasK,colors[2])}
    ${jtBuildSingleBlokTable(lok,'B',hasK,colors[3])}
  </div>`;
}

// Tabel satu blok berdiri sendiri (dipakai layout Ngadikerso), tetap pakai menu aksi ⋮ per baris.
function jtBuildSingleBlokTable(lok, blk, hasK, color) {
  const data = jtData[lok][blk] || [];
  const subs = (jtSubs[lok][blk] || []).slice().sort((a,b)=>a-b);
  const seq = [];
  let prev = 0;
  subs.forEach((pos, si) => {
    for(let i=prev; i<pos && i<data.length; i++) seq.push({type:'data', dataIdx:i, subIdx:si});
    seq.push({type:'sub', from:prev, to:pos, subIdx:si});
    prev = pos;
  });
  for(let i=prev; i<data.length; i++) seq.push({type:'data', dataIdx:i, subIdx:subs.length});

  const thS = `background:${color}dd;color:#fff;padding:4px 4px;font-size:9px;font-weight:700;text-align:center`;
  const inpS = 'width:100%;border:1.5px solid #e0d0c0;border-radius:5px;padding:3px 3px;font-size:11px;text-align:center;background:#fff;color:#1a0e05;min-width:34px';
  const tdBase = 'padding:3px 4px;font-size:11px;border-bottom:1px solid #ecddd0;vertical-align:middle';
  const totalCols = hasK ? 6 : 5;

  let bodyRows = '';
  seq.forEach((item, ri) => {
    const even = ri % 2 === 0;
    const rowBg = even ? '' : 'background:#fdf8f5';
    if(item.type==='sub') {
      const secRows = data.slice(item.from, item.to);
      const {totJ,totK,totP,totB} = jtCompute(secRows);
      const ss = `background:#f97316;color:#fff;font-weight:700;font-size:11px;padding:4px 4px;text-align:center;border:none`;
      const subActions = `[
        {label:'Tambah baris di bawah subtotal ini', icon:'ti-row-insert-bottom', fn:()=>jtSisipBaris(${lok},'${blk}',${item.to})},
        {label:'Hapus subtotal ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus baris subtotal ini?', fn:()=>jtHapusSubtotal(${lok},'${blk}',${item.subIdx})}
      ]`;
      bodyRows += `<tr>
        <td style="${ss}">${totB||'-'}</td>
        <td style="${ss};text-align:left;font-size:10px;letter-spacing:.5px">SUBTOTAL</td>
        <td style="${ss}">${totJ||'-'}</td>
        ${hasK ? `<td style="${ss}">${totK||'-'}</td>` : ''}
        <td style="${ss}">${totP||'-'}</td>
        <td style="${ss}">${jtKebabBtn('Subtotal Blok '+blk, subActions, 'background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);color:#fff')}</td>
      </tr>`;
    } else {
      const di = item.dataIdx;
      const r = data[di];
      const wSel = `<select style="width:100%;border:1.5px solid #e0d0c0;border-radius:5px;padding:2px 3px;font-size:11px;background:#fff;color:#1a0e05"
        onchange="jtSetField(${lok},'${blk}',${di},'warna',this.value)">
        ${JT_WARNA_OPTS.map(w=>`<option value="${w}"${w===(r.warna||'-')?'selected':''}>${w}</option>`).join('')}
      </select>`;
      const rowActions = `[
        {label:'Tambah baris di atas', icon:'ti-row-insert-top', fn:()=>jtSisipBaris(${lok},'${blk}',${di})},
        {label:'Tambah baris di bawah', icon:'ti-row-insert-bottom', fn:()=>jtSisipBaris(${lok},'${blk}',${di+1})},
        {label:'Tambah subtotal di bawah', icon:'ti-sum', fn:()=>jtSisipSubtotal(${lok},'${blk}',${di+1})},
        {label:'Hapus baris ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus baris BDG ${r.bdg||''} ini?', fn:()=>jtHapusBaris(${lok},'${blk}',${di})}
      ]`;
      bodyRows += `<tr style="${rowBg}">
        <td style="${tdBase};text-align:center"><input type="number" value="${r.bdg||''}" placeholder="-" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'bdg',this.value)"></td>
        <td style="${tdBase}">${wSel}</td>
        <td style="${tdBase};text-align:center"><input type="number" value="${r.jTanam||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'jTanam',this.value)"></td>
        ${hasK ? `<td style="${tdBase};text-align:center"><input type="number" value="${r.kacang||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'kacang',this.value)"></td>` : ''}
        <td style="${tdBase};text-align:center"><input type="number" value="${r.pBedeng||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'pBedeng',this.value)"></td>
        <td style="${tdBase};text-align:center">${jtKebabBtn('Blok '+blk+' — Baris', rowActions)}</td>
      </tr>`;
    }
  });

  const {totJ,totK,totP,totB} = jtCompute(data);
  const ts = `background:#FFF3EB;font-weight:700;color:#C2500A;font-size:11px;padding:5px 4px;text-align:center;border-top:2px solid #C2500A`;
  bodyRows += `<tr>
    <td style="${ts}">${totB||'-'}</td>
    <td style="${ts};text-align:left;letter-spacing:.5px">TOTAL</td>
    <td style="${ts}">${totJ||'-'}</td>
    ${hasK ? `<td style="${ts}">${totK||'-'}</td>` : ''}
    <td style="${ts}">${totP||'-'}</td>
    <td style="${ts}"></td>
  </tr>`;

  return `<table style="width:100%;border-collapse:collapse;border:1.5px solid #e0d0c0;border-radius:8px;overflow:hidden">
    <thead>
      <tr><th colspan="${totalCols}" style="background:${color};color:#fff;padding:5px 6px;font-size:11px;font-weight:700;text-align:center">BLOK ${blk}</th></tr>
      <tr>
        <th style="${thS};min-width:34px">BDG</th>
        <th style="${thS};min-width:78px;text-align:left">WARNA</th>
        <th style="${thS};min-width:42px">J.TANAM</th>
        ${hasK ? `<th style="${thS};min-width:42px">KACANG</th>` : ''}
        <th style="${thS};min-width:42px">P.BEDENG</th>
        <th style="${thS};width:30px">⋮</th>
      </tr>
    </thead>
    <tbody>
      ${bodyRows || `<tr><td colspan="${totalCols}" style="text-align:center;color:#bbb;padding:14px;font-size:11px">Belum ada data</td></tr>`}
    </tbody>
  </table>`;
}

function jtBuildAllBloksTable(lok, conf, hasK) {
  // Build one wide table with all bloks side-by-side
  const bloks = conf.blok;
  const colors = ['#1a6b3c','#1a5c8a','#7C3AED','#b8820f'];
  // Tinggi baris dikurangi: padding 3px (dari 5-6px)
  const inpS = 'width:100%;border:1.5px solid #e0d0c0;border-radius:5px;padding:3px 3px;font-size:11px;text-align:center;background:#fff;color:#1a0e05;min-width:34px';
  const tdBase = 'padding:3px 4px;font-size:11px;border-bottom:1px solid #ecddd0;vertical-align:middle';

  // Compute sequences per blok
  // seqs item: {type:'data'|'sub', dataIdx?, from?, to?, subIdx, afterDataIdx}
  const seqs = {};
  bloks.forEach(blk => {
    const data = jtData[lok][blk] || [];
    const subs = (jtSubs[lok][blk] || []).slice().sort((a,b)=>a-b);
    const seq = [];
    let prev = 0;
    subs.forEach((pos, si) => {
      for(let i=prev; i<pos && i<data.length; i++) {
        seq.push({type:'data', dataIdx:i, blk, subIdx:si});
      }
      seq.push({type:'sub', from:prev, to:pos, blk, subIdx:si});
      prev = pos;
    });
    // data rows after last subtotal (or all if no subs)
    for(let i=prev; i<data.length; i++) {
      seq.push({type:'data', dataIdx:i, blk, subIdx:subs.length});
    }
    seqs[blk] = seq;
  });

  const maxRows = Math.max(...bloks.map(blk => seqs[blk].length), 1);

  // Header row 1: blok names spanning columns
  // +1 kolom aksi (titik-3): tambah atas/bawah, subtotal, hapus — semua dalam 1 menu
  const colsPerBlok = hasK ? 5 : 4;
  const totalColsPerBlok = colsPerBlok + 1; // +aksi

  let thRow1 = '<tr>';
  bloks.forEach((blk, bi) => {
    const c = colors[bi % colors.length];
    // Header blok: padding lebih kecil
    thRow1 += `<th colspan="${totalColsPerBlok}" style="background:${c};color:#fff;padding:5px 6px;font-size:11px;font-weight:700;text-align:center;border-right:3px solid #fff">BLOK ${blk}</th>`;
  });
  thRow1 += '</tr>';

  // Header row 2: column names per blok
  let thRow2 = '<tr>';
  bloks.forEach((blk, bi) => {
    const c = colors[bi % colors.length];
    const thS = `background:${c}dd;color:#fff;padding:4px 4px;font-size:9px;font-weight:700;text-align:center`;
    thRow2 += `<th style="${thS};min-width:34px">BDG</th>`;
    thRow2 += `<th style="${thS};min-width:82px;text-align:left">WARNA</th>`; // diperlebar
    thRow2 += `<th style="${thS};min-width:42px">J.TANAM</th>`;
    if(hasK) thRow2 += `<th style="${thS};min-width:42px">KACANG</th>`;
    thRow2 += `<th style="${thS};min-width:42px">P.BEDENG</th>`;
    thRow2 += `<th style="${thS};width:34px;border-right:3px solid #fff">⋮</th>`; // aksi (titik-3)
  });
  thRow2 += '</tr>';

  // Body rows
  let bodyHtml = '';
  for(let ri = 0; ri < maxRows; ri++) {
    const even = ri % 2 === 0;
    let row = '<tr>';
    bloks.forEach((blk, bi) => {
      const borderRight = 'border-right:3px solid #e0d0c0';
      const rowBg = even ? '' : 'background:#fdf8f5';
      const item = seqs[blk][ri];
      const data = jtData[lok][blk] || [];

      if(!item) {
        const empty = `${tdBase};${borderRight}`;
        for(let c=0; c<totalColsPerBlok; c++) row += `<td style="${empty};background:transparent;border-bottom:none"></td>`;
      } else if(item.type === 'sub') {
        const secRows = data.slice(item.from, item.to);
        const {totJ,totK,totP,totB} = jtCompute(secRows);
        const ss = `background:#f97316;color:#fff;font-weight:700;font-size:11px;padding:4px 4px;text-align:center;border:none`;
        row += `<td style="${ss}">${totB||'-'}</td>`;
        row += `<td style="${ss};text-align:left;font-size:10px;letter-spacing:.5px">SUBTOTAL</td>`;
        row += `<td style="${ss}">${totJ||'-'}</td>`;
        if(hasK) row += `<td style="${ss}">${totK||'-'}</td>`;
        row += `<td style="${ss}">${totP||'-'}</td>`;
        // aksi baris subtotal: tambah baris di bawah / hapus subtotal ini
        const subActions = `[
          {label:'Tambah baris di bawah subtotal ini', icon:'ti-row-insert-bottom', fn:()=>jtSisipBaris(${lok},'${blk}',${item.to})},
          {label:'Hapus subtotal ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus baris subtotal ini?', fn:()=>jtHapusSubtotal(${lok},'${blk}',${item.subIdx})}
        ]`;
        row += `<td style="${ss};${borderRight}">${jtKebabBtn('Subtotal Blok '+blk, subActions, 'background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);color:#fff')}</td>`;
      } else {
        const di = item.dataIdx;
        const r = data[di];
        const wSel = `<select style="width:100%;border:1.5px solid #e0d0c0;border-radius:5px;padding:2px 3px;font-size:11px;background:#fff;color:#1a0e05"
          onchange="jtSetField(${lok},'${blk}',${di},'warna',this.value)">
          ${JT_WARNA_OPTS.map(w=>`<option value="${w}"${w===(r.warna||'-')?'selected':''}>${w}</option>`).join('')}
        </select>`;
        row += `<td style="${tdBase};${rowBg};text-align:center"><input type="number" value="${r.bdg||''}" placeholder="-" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'bdg',this.value)"></td>`;
        row += `<td style="${tdBase};${rowBg}">${wSel}</td>`;
        row += `<td style="${tdBase};${rowBg};text-align:center"><input type="number" value="${r.jTanam||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'jTanam',this.value)"></td>`;
        if(hasK) row += `<td style="${tdBase};${rowBg};text-align:center"><input type="number" value="${r.kacang||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'kacang',this.value)"></td>`;
        row += `<td style="${tdBase};${rowBg};text-align:center"><input type="number" value="${r.pBedeng||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'pBedeng',this.value)"></td>`;
        // aksi baris (titik-3): tambah atas/bawah, subtotal, hapus — semua dalam 1 menu
        const rowActions = `[
          {label:'Tambah baris di atas', icon:'ti-row-insert-top', fn:()=>jtSisipBaris(${lok},'${blk}',${di})},
          {label:'Tambah baris di bawah', icon:'ti-row-insert-bottom', fn:()=>jtSisipBaris(${lok},'${blk}',${di+1})},
          {label:'Tambah subtotal di bawah', icon:'ti-sum', fn:()=>jtSisipSubtotal(${lok},'${blk}',${di+1})},
          {label:'Hapus baris ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus baris BDG ${r.bdg||''} ini?', fn:()=>jtHapusBaris(${lok},'${blk}',${di})}
        ]`;
        row += `<td style="${tdBase};${rowBg};${borderRight};text-align:center">${jtKebabBtn('Blok '+blk+' — Baris', rowActions)}</td>`;
      }
    });
    row += '</tr>';
    bodyHtml += row;
  }

  // Total row per blok
  let totalRow = '<tr>';
  bloks.forEach((blk, bi) => {
    const {totJ,totK,totP,totB} = jtCompute(jtData[lok][blk]||[]);
    const ts = `background:#FFF3EB;font-weight:700;color:#C2500A;font-size:11px;padding:5px 4px;text-align:center;border-top:2px solid #C2500A`;
    totalRow += `<td style="${ts}">${totB||'-'}</td>`;
    totalRow += `<td style="${ts};text-align:left;letter-spacing:.5px">TOTAL</td>`;
    totalRow += `<td style="${ts}">${totJ||'-'}</td>`;
    if(hasK) totalRow += `<td style="${ts}">${totK||'-'}</td>`;
    totalRow += `<td style="${ts}">${totP||'-'}</td>`;
    totalRow += `<td style="${ts};border-right:3px solid #e0d0c0"></td>`;
  });
  totalRow += '</tr>';

  return `<table style="width:100%;border-collapse:collapse;min-width:${bloks.length*(hasK?320:255)}px">
    <thead>${thRow1}${thRow2}</thead>
    <tbody>
      ${bodyHtml || `<tr><td colspan="${bloks.length * totalColsPerBlok}" style="text-align:center;color:#bbb;padding:20px;font-size:12px">Belum ada data — klik Tambah Baris</td></tr>`}
      ${totalRow}
    </tbody>
  </table>`;
}

// Sisip baris baru setelah posisi data tertentu, geser subtotal yang terdampak
function jtSisipBaris(lok, blk, afterDataIdx) {
  if(!jtData[lok] || !jtData[lok][blk]) return;
  const newRow = {id:jtNewId(), bdg:'', warna:'-', jTanam:'', kacang:'', pBedeng:''};
  jtData[lok][blk].splice(afterDataIdx, 0, newRow);
  // Geser semua subtotal yang posisinya >= afterDataIdx
  jtSubs[lok][blk] = (jtSubs[lok][blk]||[]).map(s => s >= afterDataIdx ? s+1 : s);
  const conf = JT_CONF[lok];
  const wrap = document.getElementById(`jt-tbl-wrap-${lok}`);
  if(wrap) wrap.innerHTML = jtRenderTblWrap(lok, conf, conf.hasKacang);
  const rekapEl = document.getElementById(`jt-rekap-${lok}`);
  if(rekapEl) rekapEl.outerHTML = jtBuildRekap(lok, conf, conf.hasKacang);
  toast('✅ Baris disisipkan');
}

// Sisip subtotal baru setelah posisi data tertentu
function jtSisipSubtotal(lok, blk, afterDataIdx) {
  if(!jtSubs[lok]) jtSubs[lok] = {};
  if(!jtSubs[lok][blk]) jtSubs[lok][blk] = [];
  // Tambah subtotal di posisi afterDataIdx (artinya setelah baris ke afterDataIdx-1)
  const subs = jtSubs[lok][blk].slice();
  subs.push(afterDataIdx);
  jtSubs[lok][blk] = [...new Set(subs)].sort((a,b)=>a-b);
  const conf = JT_CONF[lok];
  const wrap = document.getElementById(`jt-tbl-wrap-${lok}`);
  if(wrap) wrap.innerHTML = jtRenderTblWrap(lok, conf, conf.hasKacang);
  const rekapEl = document.getElementById(`jt-rekap-${lok}`);
  if(rekapEl) rekapEl.outerHTML = jtBuildRekap(lok, conf, conf.hasKacang);
  toast('✅ Subtotal disisipkan');
}

function jtSwitchTab(lok, activeBlk) {
  // Kept for compatibility — now just re-renders the full table
  const conf = JT_CONF[lok];
  const wrap = document.getElementById(`jt-tbl-wrap-${lok}`);
  if(wrap) wrap.innerHTML = jtRenderTblWrap(lok, conf, conf.hasKacang);
}

function jtBuildTable(lok, conf, hasK) {
  return jtBuildAllBloksTable(lok, conf, hasK);
}

function jtHapusSubtotal(lok, blk, subIdx) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  if(!jtSubs[lok] || !jtSubs[lok][blk]) return;
  const subs = (jtSubs[lok][blk]||[]).slice().sort((a,b)=>a-b);
  subs.splice(subIdx, 1);
  jtSubs[lok][blk] = subs;
  renderJumlahTanaman(lok);
  saveJTSubs();
  toast('🗑️ Subtotal dihapus');
}

function jtBuildBlokTable(lok, conf, hasK, blk) {
  const data = jtData[lok][blk] || [];
  const subs = (jtSubs[lok][blk] || []).slice().sort((a,b)=>a-b);
  const bi = conf.blok.indexOf(blk);
  const hdrColors = ['#1a6b3c','#1a5c8a','#7C3AED','#b8820f'];
  const hdrBg = hdrColors[bi % hdrColors.length];

  // Build sequence
  const seq = [];
  let prev = 0;
  subs.forEach(pos => {
    for(let i=prev; i<pos && i<data.length; i++) seq.push({type:'data', dataIdx:i});
    seq.push({type:'sub', from:prev, to:pos});
    prev = pos;
  });
  for(let i=prev; i<data.length; i++) seq.push({type:'data', dataIdx:i});

  const thStyle = `padding:9px 8px;font-size:11px;font-weight:700;color:#fff;background:${hdrBg};text-align:center`;
  const tdBase = 'padding:8px 6px;font-size:12px;border-bottom:1px solid #ecddd0;vertical-align:middle';
  const inpS = 'width:100%;border:1.5px solid #e0d0c0;border-radius:6px;padding:6px 5px;font-size:13px;text-align:center;background:#fff;color:#1a0e05';

  let bodyRows = '';
  seq.forEach((item, ri) => {
    const even = ri % 2 === 0;
    const rowBg = even ? '' : 'background:#fdf8f5';

    if(item.type==='sub') {
      const secRows = data.slice(item.from, item.to);
      const {totJ,totK,totP,totB} = jtCompute(secRows);
      const ss = `background:#f97316;color:#fff;font-weight:700;font-size:12px;padding:8px 6px;text-align:center;border:none`;
      bodyRows += `<tr>
        <td style="${ss}">${totB||'-'}</td>
        <td style="${ss};text-align:left;font-size:11px;letter-spacing:.5px">SUBTOTAL</td>
        <td style="${ss}">${totJ||'-'}</td>
        ${hasK ? `<td style="${ss}">${totK||'-'}</td>` : ''}
        <td style="${ss}">${totP||'-'}</td>
        <td style="${ss}"></td>
      </tr>`;
    } else {
      const di = item.dataIdx;
      const r = data[di];
      const wSel = `<select style="width:100%;border:1.5px solid #e0d0c0;border-radius:6px;padding:6px 5px;font-size:13px;background:#fff;color:#1a0e05"
        onchange="jtSetField(${lok},'${blk}',${di},'warna',this.value)">
        ${JT_WARNA_OPTS.map(w=>`<option value="${w}"${w===(r.warna||'-')?'selected':''}>${w}</option>`).join('')}
      </select>`;
      bodyRows += `<tr style="${rowBg}">
        <td style="${tdBase};text-align:center"><input type="number" value="${r.bdg||''}" placeholder="-" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'bdg',this.value)"></td>
        <td style="${tdBase}">${wSel}</td>
        <td style="${tdBase};text-align:center"><input type="number" value="${r.jTanam||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'jTanam',this.value)"></td>
        ${hasK ? `<td style="${tdBase};text-align:center"><input type="number" value="${r.kacang||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'kacang',this.value)"></td>` : ''}
        <td style="${tdBase};text-align:center"><input type="number" value="${r.pBedeng||''}" placeholder="0" style="${inpS}" onchange="jtSetField(${lok},'${blk}',${di},'pBedeng',this.value)"></td>
        <td style="${tdBase};text-align:center">
          <button onclick="jtHapusBaris(${lok},'${blk}',${di})"
            style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;color:#c0392b;cursor:pointer;padding:4px 8px;font-size:13px">✕</button>
        </td>
      </tr>`;
    }
  });

  // Total row
  const {totJ,totK,totP,totB} = jtCompute(data);
  const ts = `background:#FFF3EB;font-weight:700;color:#C2500A;font-size:12px;padding:9px 6px;text-align:center;border-top:2px solid #C2500A`;
  bodyRows += `<tr>
    <td style="${ts}">${totB||'-'}</td>
    <td style="${ts};text-align:left;letter-spacing:.5px">TOTAL</td>
    <td style="${ts}">${totJ||'-'}</td>
    ${hasK ? `<td style="${ts}">${totK||'-'}</td>` : ''}
    <td style="${ts}">${totP||'-'}</td>
    <td style="${ts}"></td>
  </tr>`;

  return `<table style="width:100%;border-collapse:collapse;min-width:${hasK?300:250}px">
    <thead>
      <tr>
        <th style="${thStyle};width:50px">BDG</th>
        <th style="${thStyle};text-align:left">WARNA</th>
        <th style="${thStyle}">J.TANAM</th>
        ${hasK ? `<th style="${thStyle}">KACANG</th>` : ''}
        <th style="${thStyle}">P.BEDENG</th>
        <th style="${thStyle};width:36px"></th>
      </tr>
    </thead>
    <tbody>
      ${bodyRows || `<tr><td colspan="${hasK?6:5}" style="text-align:center;color:#bbb;padding:20px;font-size:12px">Belum ada data — klik Tambah Baris</td></tr>`}
    </tbody>
  </table>`;
}

function jtSetField(lok, blk, idx, field, val) {
  if(!jtData[lok]) return;
  if(!jtData[lok][blk]) return;
  if(!jtData[lok][blk][idx]) return;
  jtData[lok][blk][idx][field] = val;
  const conf = JT_CONF[lok];
  // Re-render tabel semua blok
  const wrap = document.getElementById(`jt-tbl-wrap-${lok}`);
  if(wrap) wrap.innerHTML = jtRenderTblWrap(lok, conf, conf.hasKacang);
  // Re-render rekap
  const rekapEl = document.getElementById(`jt-rekap-${lok}`);
  if(rekapEl) rekapEl.outerHTML = jtBuildRekap(lok, conf, conf.hasKacang);
}

function jtHapusBaris(lok, blk, idx) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  if(!jtData[lok] || !jtData[lok][blk]) return;
  jtData[lok][blk].splice(idx, 1);
  const subs = jtSubs[lok][blk] || [];
  jtSubs[lok][blk] = subs.map(s => s > idx ? Math.max(s-1, 0) : s);
  jtSubs[lok][blk] = [...new Set(jtSubs[lok][blk])];
  renderJumlahTanaman(lok);
  saveJT(); saveJTSubs();
  toast('🗑️ Baris dihapus');
}

function jtUpdatePosOpts(lok, blk) {
  const subs = (jtSubs[lok]&&jtSubs[lok][blk]||[]).slice().sort((a,b)=>a-b);
  let opts = `<option value="akhir">Di bawah subtotal terakhir (akhir)</option>`;
  subs.forEach((pos,si) => {
    if(si < subs.length-1) {
      opts += `<option value="${si}">Di bawah subtotal ${si+1} (setelah baris ke-${pos})</option>`;
    }
  });
  const sel = document.getElementById('jt-pos-type');
  if(sel) sel.innerHTML = opts;
}

// ── REKAP ─────────────────────────────────────────────────
function jtBuildRekap(lok, conf, hasK) {
  // Kumpulkan semua data dari semua blok
  const allRows = [];
  conf.blok.forEach(blk => allRows.push(...(jtData[lok][blk]||[])));

  // Rekap per warna
  const rekapWarna = {};
  JT_WARNA_OPTS.filter(w=>w!=='-').forEach(w => rekapWarna[w] = {jTanam:0, kacang:0});
  allRows.forEach(r => {
    const w = r.warna || '-';
    if(w==='-') return;
    if(!rekapWarna[w]) rekapWarna[w] = {jTanam:0, kacang:0};
    rekapWarna[w].jTanam += parseFloat(r.jTanam||0);
    rekapWarna[w].kacang += parseFloat(r.kacang||0);
  });

  // Total bedeng (jumlah semua bdg yang terisi)
  let totalBedeng = 0;
  allRows.forEach(r => { totalBedeng += parseFloat(r.bdg||0); });

  // Total tanaman & kacang
  let grandJ = 0, grandK = 0;
  Object.values(rekapWarna).forEach(v => { grandJ+=v.jTanam; grandK+=v.kacang; });

  // Hanya tampilkan warna yang ada isinya
  const warnaAda = Object.entries(rekapWarna).filter(([w,v]) => v.jTanam > 0 || v.kacang > 0);

  const rekapRows = warnaAda.map(([w,v]) => `
    <tr>
      <td style="font-size:10px;padding:4px 6px;font-weight:600">${w}</td>
      <td style="text-align:right;font-weight:700;color:#1a6b3c;font-size:10px;padding:4px 6px">${v.jTanam||'-'}</td>
      ${hasK ? `<td style="text-align:right;color:#7C3AED;font-size:10px;padding:4px 6px">${v.kacang||'-'}</td>` : ''}
    </tr>`).join('');

  return `<div id="jt-rekap-${lok}" style="margin-top:12px">
    <div class="sec">Rekap — ${conf.nama}</div>
    <div style="display:inline-flex;align-items:center;gap:8px;background:var(--orp);border:1px solid var(--orm);border-radius:8px;padding:4px 12px;margin-bottom:8px">
      <i class="ti ti-layout-grid" style="font-size:13px;color:var(--or)"></i>
      <span style="font-size:11px;color:var(--tm);font-weight:600">Total Bedeng:</span>
      <span style="font-size:14px;font-weight:800;color:var(--or)">${totalBedeng}</span>
    </div>
    <div class="tbl-wrap" style="border-radius:8px">
      <table style="min-width:160px;border-collapse:collapse">
        <thead>
          <tr>
            <th style="text-align:left;padding:5px 6px;font-size:9px;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">WARNA</th>
            <th style="padding:5px 6px;font-size:9px;text-align:right;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">J.TANAMAN</th>
            ${hasK ? `<th style="padding:5px 6px;font-size:9px;text-align:right;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">KACANG</th>` : ''}
          </tr>
        </thead>
        <tbody>
          ${rekapRows || `<tr><td colspan="${hasK?3:2}" style="text-align:center;color:#999;padding:10px;font-size:11px">Belum ada data</td></tr>`}
        </tbody>
        <tfoot>
          <tr style="background:var(--orp)">
            <td style="font-weight:700;color:var(--or);padding:5px 6px;font-size:10px">TOTAL</td>
            <td style="text-align:right;font-weight:700;color:var(--or);padding:5px 6px;font-size:10px">${grandJ}</td>
            ${hasK ? `<td style="text-align:right;font-weight:700;color:#7C3AED;padding:5px 6px;font-size:10px">${grandK}</td>` : ''}
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

const KAL_WARNA_OPTS = JT_WARNA_OPTS;

function kalEnsureLen() {
  ['A','B','C'].forEach(blk => {
    while (kalGrid[blk].length < kalMaxRow) kalGrid[blk].push(null);
  });
}

function kalCompute(blk, from, to) {
  // from/to = 1-based inclusive
  let j=0,p=0;
  for (let i=from; i<=to; i++) {
    const r = kalGrid[blk][i-1];
    if (r) { j += parseFloat(r.jTanam||0); p += parseFloat(r.pBedeng||0); }
  }
  return {j,p};
}

function kalGrandCompute(from, to) {
  let j=0,p=0;
  ['A','B','C'].forEach(blk => { const s = kalCompute(blk, from, to); j+=s.j; p+=s.p; });
  return {j,p};
}

    <th colspan="4" style="${thBlok}">BLOK B</th>
    <th colspan="4" style="${thBlok}">BLOK C</th>
    <th colspan="2" style="background:#fff;border:1px solid #e0d0c0"></th>
    <th style="background:#fff;border:1px solid #e0d0c0"></th>

  thead += `<tr>
    <th style="${thCol}">BDG</th><th style="${thCol};text-align:left">WARNA</th><th style="${thCol}">J.TANAM</th><th style="${thCol}">KACANG</th><th style="${thCol}">P BEDENG</th>
    <th style="${thCol}">BDG</th><th style="${thCol};text-align:left">WARNA</th><th style="${thCol}">J.TANAM</th><th style="${thCol}">P BEDENG</th>
    <th style="${thCol}">BDG</th><th style="${thCol};text-align:left">WARNA</th><th style="${thCol}">J.TANAM</th><th style="${thCol}">P BEDENG</th>
    <th style="${thCol}">J.TANAM</th><th style="${thCol}">P.BDG</th>
    <th style="${thCol}">⋮</th>
  </tr>`;

  function warnaSelect(blk, idx, r) {
    const isKacang = r && r.warna === 'KACANG';
    const bg = isKacang ? 'background:#c3e8d4' : 'background:#fff';
    return `<select style="${selS};${bg}" onchange="jtKalSetCell('${blk}',${idx},'warna',this.value)">
      ${KAL_WARNA_OPTS.map(w=>`<option value="${w}"${w===((r&&r.warna)||'-')?' selected':''}>${w}</option>`).join('')}
    </select>`;
  }
  function numInput(blk, idx, field, val) {
    return `<input type="number" value="${val==null||val===''?'':val}" style="${inpS}" onchange="jtKalSetCell('${blk}',${idx},'${field}',this.value)">`;
  }

  let body = '';
  let prevBoundary = 0;
  const sections = kalSections.slice().sort((a,b)=>a-b);
  let si = 0;

  for (let row = 1; row <= kalMaxRow; row++) {
    const idx = row - 1;
    const rA = kalGrid.A[idx], rB = kalGrid.B[idx], rC = kalGrid.C[idx];
    const rowBg = row % 2 === 0 ? '' : 'background:#fdf8f5';
    body += `<tr>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('A',idx,'bdg',rA?rA.bdg:'')}</td>
      <td style="${tdBase};${rowBg}">${warnaSelect('A',idx,rA)}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('A',idx,'jTanam',rA?rA.jTanam:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('A',idx,'kacang',rA?rA.kacang:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('A',idx,'pBedeng',rA?rA.pBedeng:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('B',idx,'bdg',rB?rB.bdg:'')}</td>
      <td style="${tdBase};${rowBg}">${warnaSelect('B',idx,rB)}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('B',idx,'jTanam',rB?rB.jTanam:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('B',idx,'pBedeng',rB?rB.pBedeng:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('C',idx,'bdg',rC?rC.bdg:'')}</td>
      <td style="${tdBase};${rowBg}">${warnaSelect('C',idx,rC)}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('C',idx,'jTanam',rC?rC.jTanam:'')}</td>
      <td style="${tdBase};${rowBg};text-align:center">${numInput('C',idx,'pBedeng',rC?rC.pBedeng:'')}</td>
      <td style="${tdBase};${rowBg}"></td>
      <td style="${tdBase};${rowBg}"></td>
      <td style="${tdBase};${rowBg};text-align:center">${jtKebabBtn('Baris '+row, `[
        {label:'Tambah baris di atas', icon:'ti-row-insert-top', fn:()=>jtKalSisipBaris(${row},'above')},
        {label:'Tambah baris di bawah', icon:'ti-row-insert-bottom', fn:()=>jtKalSisipBaris(${row},'below')},
        {label:'Tambah subtotal di bawah', icon:'ti-sum', fn:()=>jtKalAddSubtotalAt(${row})},
        {label:'Hapus baris ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus baris ${row} (Blok A/B/C sekaligus)?', fn:()=>jtKalHapusBaris(${row})}
      ]`)}</td>
    </tr>`;

    if (si < sections.length && sections[si] === row) {
      const a = kalCompute('A', prevBoundary+1, row);
      const b = kalCompute('B', prevBoundary+1, row);
      const c = kalCompute('C', prevBoundary+1, row);
      const g = kalGrandCompute(prevBoundary+1, row);
      const ss = `background:#f97316;color:#fff;font-weight:700;font-size:10px;padding:4px 3px;text-align:center;border:none`;
      const isLast = si === sections.length - 1;
      const subRow = row;
      body += `<tr>
        <td style="${ss}"></td><td style="${ss}"></td><td style="${ss}">${a.j||'-'}</td><td style="${ss}"></td><td style="${ss}">${a.p||'-'}</td>
        <td style="${ss}"></td><td style="${ss}"></td><td style="${ss}">${b.j||'-'}</td><td style="${ss}">${b.p||'-'}</td>
        <td style="${ss}"></td><td style="${ss}"></td><td style="${ss}">${c.j||'-'}</td><td style="${ss}">${c.p||'-'}</td>
        <td style="${ss}">${g.j||'-'}</td><td style="${ss}">${g.p||'-'}</td>
        <td style="${ss}">${jtKebabBtn('Subtotal baris '+subRow, `[
          {label:'Tambah baris di bawah subtotal ini', icon:'ti-row-insert-bottom', fn:()=>jtKalSisipBaris(${subRow},'below')},
          {label:'Hapus subtotal ini', icon:'ti-trash', danger:true, confirmMsg:'Hapus subtotal ini?', fn:()=>jtKalHapusSubtotalAt(${subRow})}
        ]`, 'background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);color:#fff')}</td>
      </tr>`;
      prevBoundary = row;
      si++;
      if (isLast) {
        // Baris GRAND TOTAL keseluruhan (semua section digabung)
        const gt = kalGrandCompute(1, row);
        const gs = `background:#fff;padding:4px 3px;border:1px solid #e0d0c0`;
        const gsN = `background:#FFF3EB;color:#C2500A;font-weight:800;font-size:11px;padding:4px 3px;text-align:center;border:1px solid #C2500A`;
        body += `<tr>
          <td style="${gs}" colspan="14"></td>
          <td style="${gsN}">${gt.j||'-'}</td><td style="${gsN}">${gt.p||'-'}</td>
        </tr>`;
      }
    }
  }

  return `<table style="width:100%;border-collapse:collapse;min-width:900px">
    <thead>${thead}</thead>
    <tbody>${body}</tbody>
  </table>`;
}

function jtKalSetCell(blk, idx, field, val) {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');kalRefreshTable();return;}
  kalEnsureLen();
  if (!kalGrid[blk][idx]) kalGrid[blk][idx] = {bdg:'',warna:'-',jTanam:'',kacang:'',pBedeng:''};
  kalGrid[blk][idx][field] = val;
  kalRefreshTable();
  clearTimeout(kalSaveTimer);
  kalSaveTimer = setTimeout(saveKalGrid, 1200);
}

function jtKalAddRow() {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  kalMaxRow++;
  kalEnsureLen();
  kalRefreshTable();
  clearTimeout(kalSaveTimer);
  kalSaveTimer = setTimeout(saveKalGrid, 800);
  toast('✅ Baris ditambahkan');
}

function jtKalAddSubtotal() {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  if (kalSections.includes(kalMaxRow)) { toast('⚠️ Baris terakhir sudah jadi subtotal'); return; }
  kalSections.push(kalMaxRow);
  kalSections.sort((a,b)=>a-b);
  kalRefreshTable();
  saveKalGrid();
  toast('✅ Subtotal ditambahkan');
}

// Sisip 1 baris kosong (Blok A/B/C sekaligus, tetap sinkron) di atas/bawah baris nomor `rn` (1-based)
function jtKalSisipBaris(rn, mode) {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  kalEnsureLen();
  const R = mode === 'above' ? rn : rn + 1; // posisi 1-based baris baru
  const insertPos = R - 1; // index 0-based
  ['A','B','C'].forEach(blk => kalGrid[blk].splice(insertPos, 0, null));
  kalMaxRow++;
  kalSections = kalSections.map(s => s >= R ? s + 1 : s);
  kalRefreshTable();
  clearTimeout(kalSaveTimer);
  kalSaveTimer = setTimeout(saveKalGrid, 800);
  toast('✅ Baris disisipkan');
}

// Hapus baris nomor `rn` (1-based) dari Blok A/B/C sekaligus
function jtKalHapusBaris(rn) {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  if (kalMaxRow <= 1) { toast('⚠️ Minimal harus ada 1 baris'); return; }
  const idx0 = rn - 1;
  ['A','B','C'].forEach(blk => kalGrid[blk].splice(idx0, 1));
  kalMaxRow--;
  kalSections = [...new Set(kalSections.map(s => s >= rn ? s - 1 : s).filter(s => s > 0))].sort((a,b)=>a-b);
  kalRefreshTable();
  clearTimeout(kalSaveTimer);
  kalSaveTimer = setTimeout(saveKalGrid, 800);
  toast('🗑️ Baris dihapus');
}

// Tambah subtotal tepat setelah baris nomor `rn` (bisa di posisi manapun, bukan cuma akhir)
function jtKalAddSubtotalAt(rn) {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  if (kalSections.includes(rn)) { toast('⚠️ Baris ini sudah jadi subtotal'); return; }
  kalSections.push(rn);
  kalSections.sort((a,b)=>a-b);
  kalRefreshTable();
  saveKalGrid();
  toast('✅ Subtotal ditambahkan');
}

function jtKalHapusSubtotalAt(rn) {
  if(!canEditLoc(1)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  kalSections = kalSections.filter(s => s !== rn);
  kalRefreshTable();
  saveKalGrid();
  toast('🗑️ Subtotal dihapus');
}

// Rekap gabungan per warna (Blok A+B+C jadi satu) — sebelumnya hilang di tampilan grid Kalibanger
function jtKalBuildRekap() {
  const rekapWarna = {};
  JT_WARNA_OPTS.filter(w=>w!=='-').forEach(w => rekapWarna[w] = {jTanam:0, kacang:0});
  let totalBedeng = 0;
  ['A','B','C'].forEach(blk => {
    (kalGrid[blk]||[]).forEach(r => {
      if(!r) return;
      totalBedeng += parseFloat(r.bdg||0);
      const w = r.warna || '-';
      if(w==='-') return;
      if(!rekapWarna[w]) rekapWarna[w] = {jTanam:0, kacang:0};
      rekapWarna[w].jTanam += parseFloat(r.jTanam||0);
      rekapWarna[w].kacang += parseFloat(r.kacang||0);
    });
  });
  let grandJ=0, grandK=0;
  Object.values(rekapWarna).forEach(v => { grandJ+=v.jTanam; grandK+=v.kacang; });
  const warnaAda = Object.entries(rekapWarna).filter(([w,v]) => v.jTanam>0 || v.kacang>0);
  const rekapRows = warnaAda.map(([w,v]) => `
    <tr>
      <td style="font-size:10px;padding:4px 6px;font-weight:600">${w}</td>
      <td style="text-align:right;font-weight:700;color:#1a6b3c;font-size:10px;padding:4px 6px">${v.jTanam||'-'}</td>
      <td style="text-align:right;color:#7C3AED;font-size:10px;padding:4px 6px">${v.kacang||'-'}</td>
    </tr>`).join('');

  return `<div id="kal-rekap" style="margin-top:12px">
    <div class="sec">Rekap — Kalibanger</div>
    <div style="display:inline-flex;align-items:center;gap:8px;background:var(--orp);border:1px solid var(--orm);border-radius:8px;padding:4px 12px;margin-bottom:8px">
      <i class="ti ti-layout-grid" style="font-size:13px;color:var(--or)"></i>
      <span style="font-size:11px;color:var(--tm);font-weight:600">Total Bedeng:</span>
      <span style="font-size:14px;font-weight:800;color:var(--or)">${totalBedeng}</span>
    </div>
    <div class="tbl-wrap" style="border-radius:8px">
      <table style="min-width:160px;border-collapse:collapse">
        <thead>
          <tr>
            <th style="text-align:left;padding:5px 6px;font-size:9px;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">WARNA</th>
            <th style="padding:5px 6px;font-size:9px;text-align:right;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">J.TANAMAN</th>
            <th style="padding:5px 6px;font-size:9px;text-align:right;background:linear-gradient(135deg,#1a6b3c,#2d8a50)">KACANG</th>
          </tr>
        </thead>
        <tbody>
          ${rekapRows || `<tr><td colspan="3" style="text-align:center;color:#999;padding:10px;font-size:11px">Belum ada data</td></tr>`}
        </tbody>
        <tfoot>
          <tr style="background:var(--orp)">
            <td style="font-weight:700;color:var(--or);padding:5px 6px;font-size:10px">TOTAL</td>
            <td style="text-align:right;font-weight:700;color:var(--or);padding:5px 6px;font-size:10px">${grandJ}</td>
            <td style="text-align:right;font-weight:700;color:#7C3AED;padding:5px 6px;font-size:10px">${grandK}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

let kalSaveTimer = null;
function saveKalGrid() {
  fbSave('kalGrid', kalGrid);
  fbSave('kalSections', kalSections);
  fbSave('kalMaxRow', kalMaxRow);
}

function jtKalPrint() {
  const tbl = jtKalBuildTable()
    .replace(/<select[^>]*onchange="jtKalSetCell\('[A-Z]',\d+,'warna',this\.value\)"[^>]*>[\s\S]*?<\/select>/g, m => {
      const sel = m.match(/value="([^"]*)"\s+selected/);
      return `<span>${sel ? sel[1] : ''}</span>`;
    })
    .replace(/<input[^>]*value="([^"]*)"[^>]*>/g, (m,v) => `<span>${v}</span>`)
    .replace(/<button onclick="jtOpenRowMenu[\s\S]*?<\/button>/g, ''); // kolom aksi (⋮) tidak perlu diprint
  const rekap = jtKalBuildRekap();
  const html = PX.open('Jumlah Tanaman Kalibanger')
    + PX.header('Jumlah Tanaman — Kalibanger', 'Rekap seluruh Blok A, B, C')
    + `<style>table td,table th{border:1px solid #ddd}</style>`
    + tbl
    + rekap
    + PX.close();
  PX.doOpen(html);
}

// ── PRINT JUMLAH TANAMAN ─────────────────────────────────
function jtPrint(lok) {
  const conf = JT_CONF[lok];
  const hasK = conf.hasKacang;
  const bloks = conf.blok;

  let thHtml = `<tr>`;
  bloks.forEach((blk,bi) => {
    const cols = hasK ? 5 : 4;
    thHtml += `<th colspan="${cols}" style="background:${bi%2===0?'#1a6b3c':'#2d8a50'}">BLOK ${blk}</th>`;
    if(bi<bloks.length-1) thHtml+=`<th style="width:4px;background:#fff;border:none"></th>`;
  });
  thHtml += `</tr><tr>`;
  bloks.forEach((blk,bi) => {
    thHtml += `<th>BDG</th><th>WARNA</th><th>J.TANAM</th>`;
    if(hasK) thHtml+=`<th>KACANG</th>`;
    thHtml+=`<th>P.BEDENG</th>`;
    if(bi<bloks.length-1) thHtml+=`<th style="width:4px;background:#fff;border:none"></th>`;
  });
  thHtml += `</tr>`;

  // Build body
  const blkState2 = {};
  bloks.forEach(blk => {
    blkState2[blk] = { dataIdx: 0, subShown: 0 };
  });
  const blkDispLen2 = {};
  bloks.forEach(blk => {
    blkDispLen2[blk] = jtData[lok][blk].length + (jtSubs[lok][blk]||[]).length;
  });
  const totalDispRows2 = Math.max(...Object.values(blkDispLen2), 1);

  let bodyHtml = '';
  for(let dispR=0; dispR<totalDispRows2; dispR++) {
    let row = `<tr>`;
    bloks.forEach((blk,bi) => {
      const state = blkState2[blk];
      const data = jtData[lok][blk];
      const subsArr = (jtSubs[lok][blk]||[]).slice().sort((a,b)=>a-b);
      const subIdx = state.subShown < subsArr.length ? subsArr[state.subShown] : Infinity;
      const isSubRow = (state.dataIdx >= subIdx && state.subShown < subsArr.length);

      if(isSubRow) {
        const prevSub = state.subShown > 0 ? subsArr[state.subShown-1] : 0;
        const {totJ,totK,totP,totB} = jtCompute(data.slice(prevSub, subIdx));
        const sty='background:#f97316;color:#fff;font-weight:700;text-align:center;border:none;font-size:8px;padding:3px';
        row+=`<td style="${sty}">${totB||''}</td><td style="${sty}"></td><td style="${sty}">${totJ||''}</td>`;
        if(hasK) row+=`<td style="${sty}">${totK||''}</td>`;
        row+=`<td style="${sty}">${totP||''}</td>`;
        state.subShown++;
      } else if(state.dataIdx < data.length) {
        const r=data[state.dataIdx];
        row+=`<td style="text-align:center">${r.bdg||''}</td><td>${r.warna||'-'}</td><td style="text-align:center">${r.jTanam||''}</td>`;
        if(hasK) row+=`<td style="text-align:center">${r.kacang||''}</td>`;
        row+=`<td style="text-align:center">${r.pBedeng||''}</td>`;
        state.dataIdx++;
      } else {
        const cols = hasK ? 5 : 4;
        row+=`<td colspan="${cols}" style="border:none;background:transparent"></td>`;
      }
      if(bi<bloks.length-1) row+=`<td style="width:4px;background:#fff;border:none"></td>`;
    });
    row+=`</tr>`;
    bodyHtml+=row;
  }

  // Grand total
  let gtRow=`<tr style="background:#FFF3EB">`;
  bloks.forEach((blk,bi)=>{
    const {totJ,totK,totP,totB}=jtCompute(jtData[lok][blk]);
    gtRow+=`<td style="font-weight:700;color:#C2500A;text-align:center">${totB||''}</td>`;
    gtRow+=`<td style="font-weight:700;color:#C2500A">TOTAL</td>`;
    gtRow+=`<td style="font-weight:700;color:#C2500A;text-align:center">${totJ||''}</td>`;
    if(hasK) gtRow+=`<td style="font-weight:700;color:#7C3AED;text-align:center">${totK||''}</td>`;
    gtRow+=`<td style="font-weight:700;color:#C2500A;text-align:center">${totP||''}</td>`;
    if(bi<bloks.length-1) gtRow+=`<td style="width:4px;background:#fff;border:none"></td>`;
  });
  gtRow+=`</tr>`;

  // Rekap warna for print
  const allRows=[]; conf.blok.forEach(blk=>allRows.push(...(jtData[lok][blk]||[])));
  const rw={};
  allRows.forEach(r=>{const w=r.warna||'-';if(w==='-')return;if(!rw[w])rw[w]={jTanam:0,kacang:0};rw[w].jTanam+=parseFloat(r.jTanam||0);rw[w].kacang+=parseFloat(r.kacang||0);});
  let totalBedengPrint=0; allRows.forEach(r=>totalBedengPrint+=parseFloat(r.bdg||0));
  const rekapPrintRows=Object.entries(rw).filter(([w,v])=>v.jTanam>0||v.kacang>0).map(([w,v])=>`<tr><td>${w}</td><td style="text-align:right">${v.jTanam||'-'}</td>${hasK?`<td style="text-align:right">${v.kacang||'-'}</td>`:''}</tr>`).join('');
  let grandJP=0; Object.values(rw).forEach(v=>grandJP+=v.jTanam);

  const html = PX.open(`Jumlah Tanaman ${conf.nama}`)
    + PX.header(`Jumlah Tanaman — ${conf.nama}`, `Dicetak dari Wawan Bunga v14`)
    + `<p style="font-weight:700;text-align:center;font-size:13px;margin-bottom:8px">JUMLAH TANAMAN ${conf.nama.toUpperCase()}</p>
    <table><thead>${thHtml}</thead><tbody>${bodyHtml}${gtRow}</tbody></table>
    <p style="font-weight:700;margin:10px 0 4px;font-size:11px">Rekap Per Warna | Total Bedeng: <span style="color:#C2500A">${totalBedengPrint}</span></p>
    <table style="max-width:300px">
      <thead><tr><th style="text-align:left">WARNA</th><th>J.TANAMAN</th>${hasK?'<th>KACANG</th>':''}</tr></thead>
      <tbody>${rekapPrintRows}</tbody>
      <tfoot><tr class="total"><td>TOTAL</td><td style="text-align:right">${grandJP}</td>${hasK?`<td style="text-align:right">-</td>`:''}</tr></tfoot>
    </table>`
    + PX.close();
  PX.doOpen(html);
}

// Data struktur:
// puvData[lok] = { rows: [{id, rumah, sub}], cols: ['2024-01-15', ...] }
// rows: tiap row bisa "rumah" (group header, merged) atau "sub" (baris A/B/dst)
// puvCells[lok][rowId][colIdx] = value (isi tanggal)

const PUV_CONF = {
  1: { nama:'Kalibanger', color:'#1a6b3c', bg:'#edf7f1' },
  2: { nama:'Tegalroto',  color:'#1D4ED8', bg:'#eff6ff' },
  3: { nama:'Ngadikerso', color:'#7C3AED', bg:'#f5f3ff' },
  4: { nama:'Sawah Gondang', color:'#b8820f', bg:'#fefce8' },
};

// puvData[lok].rows = [{id, type:'rumah'|'sub', label, rumahId}]
// puvData[lok].cols = [dateStr, ...]
// ── DATA AWAL (SEED) PLASTIK UV ────────────────────────────
// Struktur bawaan sesuai denah bedeng nyata tiap lokasi.
// Ini cuma dipakai kalau di Firebase belum ada data tersimpan (lihat applyRemoteData).
function puvRange(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
const PUV_SPEC = {
  1: [ // Kalibanger: rumah 1 (A saja), 2-13 (A,B), 14 (A,B,C)
    [1,['A']],
    ...puvRange(2,13).map(n=>[n,['A','B']]),
    [14,['A','B','C']],
  ],
  2: [ // Tegalroto: 1(A), R.RABUK(B), 2(A), 3-13(A,B), 14-20(A)
    [1,['A']],
    ['R.RABUK',['B']],
    [2,['A']],
    ...puvRange(3,13).map(n=>[n,['A','B']]),
    ...puvRange(14,20).map(n=>[n,['A']]),
  ],
  3: puvRange(1,6).map(n=>[n,['A','B']]), // Ngadikerso: 1-6 (A,B)
  4: puvRange(1,8).map(n=>[n,['A','B']]), // Sawah Gondang: 1-8 (A,B) — sementara
};
function buildPUVSeed() {
  let idCounter = 1;
  const data = {}, cells = {};
  [1,2,3,4].forEach(lok=>{
    const rows = []; const lokCells = {};
    (PUV_SPEC[lok]||[]).forEach(([label,subs])=>{
      const rumahId = idCounter++;
      rows.push({ id:rumahId, type:'rumah', label:String(label) });
      subs.forEach(subLabel=>{
        const subId = idCounter++;
        rows.push({ id:subId, type:'sub', label:subLabel, rumahId });
        lokCells[subId] = {};
      });
    });
    data[lok] = { rows, cols:[] };
    cells[lok] = lokCells;
  });
  return { data, cells, nextId: idCounter };
}
const PUV_SEED = buildPUVSeed();
let puvData = PUV_SEED.data;
let puvCells = PUV_SEED.cells;
let puvNextId = PUV_SEED.nextId;
function puvNewId(){ return puvNextId++; }

// Gabung data dari Firebase dengan seed bawaan PER LOKASI.
// Kalau suatu lokasi (mis. Sawah Gondang) belum ada / kosong di data tersimpan,
// dia dilengkapi otomatis dari seed — bukan bikin seluruh tabel hilang/undefined.
// Juga menjaga rows/cols selalu berupa array yang valid — Firebase RTDB membuang
// total field array yang kosong (mis. cols:[]) saat disimpan, jadi saat dibaca ulang
// field itu bisa jadi undefined dan bikin renderPlastikUV error diam-diam.
function normalizePUVLoc(loc) {
  if (!loc) return null;
  return {
    rows: Array.isArray(loc.rows) ? loc.rows : [],
    cols: Array.isArray(loc.cols) ? loc.cols : []
  };
}
function mergePUVData(remote) {
  const merged = {};
  [1,2,3,4].forEach(lok=>{
    const rem = remote && remote[lok];
    merged[lok] = (rem && rem.rows && rem.rows.length) ? normalizePUVLoc(rem) : PUV_SEED.data[lok];
  });
  return merged;
}
function mergePUVCells(remote) {
  const merged = {};
  [1,2,3,4].forEach(lok=>{
    merged[lok] = (remote && remote[lok]) ? remote[lok] : (PUV_SEED.cells[lok] || {});
  });
  return merged;
}

  // ── Header tanggal — lebar kolom seragam, tombol hapus kecil di pojok header ──
  const thStyle = `background:${conf.color}`;
  let dateHeaders = d.cols.map((c, ci) => {
    const d2 = c ? new Date(c + 'T00:00:00') : null;
    const label = d2 ? `${d2.getDate()}/${d2.getMonth()+1}/${String(d2.getFullYear()).slice(2)}` : `#${ci+1}`;
    return `<th class="puv-th-date" style="${thStyle}">${label}<button class="puv-th-del" onclick="puvHapusKolom(${lok},${ci})" title="Hapus tanggal ini">&times;</button></th>`;
  }).join('');

  // ── Baris tabel: Rumah di-merge (rowspan), SATU tombol menu "⋮" per rumah ──
  let bodyHtml = '';
  const rumahRows = d.rows.filter(r => r.type === 'rumah');
  rumahRows.forEach((rumah, ri) => {
    const subs = d.rows.filter(r => r.type === 'sub' && r.rumahId === rumah.id);
    const rowBg = ri % 2 === 0 ? '' : 'background:#fdf8f5';
    subs.forEach((sub, si) => {
      bodyHtml += `<tr style="${rowBg}">`;
      if (si === 0) {
        bodyHtml += `<td class="puv-cell-rumah" rowspan="${subs.length}" style="background:${conf.bg};color:${conf.color}">
          <div class="puv-cell-rumah-inner">
            <button class="puv-menu-btn" onclick="puvOpenRumahMenu(${lok},'${rumah.id}')" title="Menu rumah ini">&#8942;</button>
            <span class="puv-rumah-num">${rumah.label}</span>
          </div>
        </td>`;
      }
      const dateCells = d.cols.map((col, ci) => {
        const val = (puvCells[lok][sub.id] && puvCells[lok][sub.id][ci]) || '';
        return `<td class="puv-cell-date"><input type="date" value="${val}" onchange="puvSetCell(${lok},'${sub.id}',${ci},this.value)"></td>`;
      }).join('');
      bodyHtml += `<td class="puv-cell-sub">${sub.label}</td>${dateCells}</tr>`;
    });
  });

  if (!bodyHtml) {
    const emptySpan = 2 + colCount;
    bodyHtml = `<tr><td colspan="${emptySpan}" style="text-align:center;color:#bbb;padding:20px;font-size:12px">Belum ada data &mdash; klik Tambah Rumah</td></tr>`;
  }

  const PUV_COL_RUMAH = 60, PUV_COL_SUB = 48, PUV_COL_DATE = 66;
  const puvTableWidth = PUV_COL_RUMAH + PUV_COL_SUB + colCount * PUV_COL_DATE;
  const colgroup = `<colgroup>
      <col style="width:${PUV_COL_RUMAH}px">
      <col style="width:${PUV_COL_SUB}px">
      ${d.cols.map(() => `<col style="width:${PUV_COL_DATE}px">`).join('')}
    </colgroup>`;

  document.getElementById('MC').innerHTML = `
    ${actionBar}
    <div class="puv-tablewrap">
      <table class="puv-table" style="width:${puvTableWidth}px">
        ${colgroup}
        <thead>
          <tr>
            <th class="puv-th-merged" colspan="2" style="${thStyle}">RUMAH</th>
            ${dateHeaders}
          </tr>
        </thead>
        <tbody>${bodyHtml}</tbody>
      </table>
    </div>`;
  mcScrollSet(_sl);
  applyReadOnlyGuard();
}

// ── Menu "⋮" satu-satunya titik edit per rumah (buka lewat modal MO yang sudah ada) ──
function puvOpenRumahMenu(lok, rumahId) {
  const d = puvData[lok];
  const rId = parseInt(rumahId);
  const rumah = d.rows.find(r => r.id === rId);
  if (!rumah) return;
  const subs = d.rows.filter(r => r.type === 'sub' && r.rumahId === rId);
  const conf = PUV_CONF[lok];

  document.getElementById('mo-title').textContent = 'Rumah ' + rumah.label;
  document.getElementById('mo-body').innerHTML = `
    <div class="puv-menu-list">
      <button class="puv-menu-action" style="background:${conf.color}" onclick="puvTambahSub(${lok},'${rId}');puvCloseMenu()">
        <i class="ti ti-plus"></i> Tambah baris (A/B baru)
      </button>
      ${subs.map(s => `<div class="puv-menu-row">
        <span>Baris ${s.label}</span>
        <button onclick="puvHapusSub(${lok},'${s.id}');puvCloseMenu()">Hapus</button>
      </div>`).join('')}
      <button class="puv-menu-action" style="background:#c0392b" onclick="puvHapusRumah(${lok},'${rId}');puvCloseMenu()">
        <i class="ti ti-trash"></i> Hapus rumah ${rumah.label} (semua baris)
      </button>
    </div>`;
  document.querySelector('.mo-btns').style.display = 'none'; // tombol Batal/Simpan bawaan tidak dipakai di menu ini
  moCtx = { type: 'puv-menu' };
  showMO();
}
function puvCloseMenu(){ hideMO(); }

// ── ACTIONS ───────────────────────────────────────────────
function puvTambahRumah(lok) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  const d = puvData[lok];
  const rumahRows = d.rows.filter(r=>r.type==='rumah');
  const nextNum = rumahRows.length + 1;
  const rumahId = puvNewId();
  const subId = puvNewId();
  d.rows.push({ id: rumahId, type:'rumah', label: String(nextNum) });
  d.rows.push({ id: subId,   type:'sub',   label:'A', rumahId });
  if(!puvCells[lok][subId]) puvCells[lok][subId] = {};
  renderPlastikUV(lok);
  savePUV();
  toast('✅ Rumah ' + nextNum + ' ditambahkan');
}

function puvTambahSub(lok, rumahId) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  const d = puvData[lok];
  const rId = parseInt(rumahId);
  const siblings = d.rows.filter(r=>r.type==='sub' && r.rumahId===rId);
  const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const nextLabel = labels[siblings.length] || String(siblings.length+1);
  const subId = puvNewId();
  let insertIdx = d.rows.findIndex(r=>r.id===rId);
  for(let i=insertIdx+1; i<d.rows.length; i++) {
    if(d.rows[i].type==='rumah') { insertIdx=i; break; }
    insertIdx=i+1;
  }
  if(insertIdx>d.rows.length) insertIdx=d.rows.length;
  d.rows.splice(insertIdx,0,{ id:subId, type:'sub', label:nextLabel, rumahId:rId });
  if(!puvCells[lok][subId]) puvCells[lok][subId]={};
  renderPlastikUV(lok);
  savePUV();
  toast('✅ Sub baris ditambahkan');
}

function puvHapusRumah(lok, rumahId) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  const rId = parseInt(rumahId);
  puvData[lok].rows = puvData[lok].rows.filter(r => !(r.id===rId || (r.type==='sub' && r.rumahId===rId)));
  renderPlastikUV(lok);
  savePUV();
  toast('🗑️ Rumah dihapus');
}

function puvHapusSub(lok, subId) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  const sId = parseInt(subId);
  puvData[lok].rows = puvData[lok].rows.filter(r => r.id!==sId);
  delete puvCells[lok][sId];
  renderPlastikUV(lok);
  savePUV();
  toast('🗑️ Baris dihapus');
}

function puvTambahKolom(lok) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  puvData[lok].cols.push('');
  renderPlastikUV(lok);
  savePUV();
  toast('✅ Kolom tanggal ditambahkan');
}

function puvHapusKolom(lok, ci) {
  if(!canEditLoc(lok)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  puvData[lok].cols.splice(ci,1);
  Object.values(puvCells[lok]).forEach(rowCells => {
    const newCells = {};
    Object.entries(rowCells).forEach(([k,v]) => {
      const ki = parseInt(k);
      if(ki < ci) newCells[ki] = v;
      else if(ki > ci) newCells[ki-1] = v;
    });
    Object.keys(rowCells).forEach(k => delete rowCells[k]);
    Object.assign(rowCells, newCells);
  });
  renderPlastikUV(lok);
  savePUV();
  toast('🗑️ Kolom dihapus');
}

// Debounce untuk puvSetCell agar tidak spam Firebase tiap ketik
let puvSaveTimer = null;
function puvSetCell(lok, subId, ci, val) {
  const sId = parseInt(subId);
  if(!puvCells[lok][sId]) puvCells[lok][sId]={};
  puvCells[lok][sId][ci] = val;
  if(val && !puvData[lok].cols[ci]) {
    puvData[lok].cols[ci] = val;
    renderPlastikUV(lok);
  }
  clearTimeout(puvSaveTimer);
  puvSaveTimer = setTimeout(() => savePUV(), 1500);
}

// Hapus akun (di luar saveMO)
function hapusAkun(uid) {
  if (uid === CU.id) { toast('⛔ Tidak bisa hapus akun sendiri!'); return; }
  const u = USERS.find(x=>x.id===uid);
  if (!u) return;
  if (!confirm(`Hapus akun "${u.name}" (@${u.username})?\nTindakan ini tidak bisa dibatalkan.`)) return;
  USERS.splice(USERS.findIndex(x=>x.id===uid),1);
  saveUsers();
  toast('🗑️ Akun dihapus');
  renderAkunAdmin();
}
