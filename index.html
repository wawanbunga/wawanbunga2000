<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wawan Bunga</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --or:#C2500A;--orl:#E8650A;--orp:#FFF3EB;--orm:#FFD5B0;
  --bg:#f5f0eb;--w:#fff;
  --t:#1a0e05;--tx:#1a0e05;--tm:#7a4020;--tl:#8a5a3a;
  --b:#e8d5c0;
  --sh:0 1px 8px rgba(194,80,10,.10);
  --shm:0 6px 28px rgba(194,80,10,.18);
  --r:16px;--rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Hilangkan tombol panah atas/bawah (spinner) di semua input angka — supaya tidak menutupi angka */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none!important;margin:0!important;display:none!important}
input[type=number]{-moz-appearance:textfield!important;appearance:textfield!important}
html,body{height:100%;width:100%;overflow-x:hidden;background:var(--bg)}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--t);
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

#LS{flex:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,#1a0800 0%,#5c1a00 50%,#C2500A 100%);
  padding:20px;position:relative;overflow:hidden}
#LS::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(232,101,10,.22),transparent 55%),
             radial-gradient(ellipse at 80% 80%,rgba(255,180,80,.10),transparent 50%);pointer-events:none}
.lc{background:#fff;border-radius:24px;padding:38px 24px 32px;width:100%;max-width:360px;
  box-shadow:0 28px 70px rgba(0,0,0,.38);position:relative;z-index:1}
.ll{text-align:center;margin-bottom:28px}
.ll-logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#E8650A,#C2500A);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  box-shadow:0 6px 20px rgba(194,80,10,.35)}
.ll-logo i{font-size:32px;color:#fff}
.ll h1{font-family:'Playfair Display',serif;font-size:24px;color:var(--or)}
.ll p{color:var(--tl);font-size:12px;margin-top:4px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tm);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--b);border-radius:var(--rs);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--t);background:#fff;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--orl)}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#E8650A,#C2500A);color:#fff;border:none;
  border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;
  box-shadow:0 4px 16px rgba(194,80,10,.35);transition:opacity .2s}
.btn-login:active{opacity:.85}
.lerr{color:#c0392b;font-size:12px;margin-top:8px;text-align:center;display:none}
.demo-hint{margin-top:16px;font-size:11px;color:#bbb;text-align:center;line-height:2}
.warn-banner{display:flex;align-items:center;gap:8px;background:#FFF3EB;border:1.5px solid var(--orm);
  border-radius:var(--rs);padding:10px 12px;margin-bottom:18px;font-size:12px;color:var(--or);font-weight:600;line-height:1.4}
.warn-banner i{font-size:18px;flex-shrink:0}

#APP{display:none;flex-direction:column;flex:1;width:100%;min-height:100vh;min-height:100dvh;background:var(--bg)}

.tb{background:linear-gradient(135deg,#E8650A,#C2500A);color:#fff;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;box-shadow:0 4px 18px rgba(194,80,10,.28);
  width:100%;gap:8px}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tb-back{background:rgba(255,255,255,.18);border:none;color:#fff;width:40px;height:40px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;flex-shrink:0;transition:background .15s}
.tb-back:active{background:rgba(255,255,255,.35)}
.tb-logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tb-title{font-family:'Playfair Display',serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.tb-sub{font-size:11px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.btn-out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;min-height:36px}

.mc{flex:1;padding:12px;max-width:480px;margin:0 auto;width:100%;padding-bottom:32px}

.home-header{text-align:center;padding:18px 0 20px}
.home-header h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--or)}
.home-header p{font-size:12px;color:var(--tl);margin-top:4px}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.menu-card{background:var(--w);border-radius:var(--r);padding:13px 10px 11px;
  border:1.5px solid var(--b);cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:var(--sh);text-align:center;position:relative;overflow:hidden}
.menu-card:active{transform:scale(.96);box-shadow:var(--shm)}
.mc-icon-wrap{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.mc-label{font-size:13px;font-weight:700;color:var(--t)}
.mc-sub{font-size:11px;color:var(--tl)}
.menu-card.or{border-color:var(--orm);background:var(--orp)}
.menu-card.green{border-color:#c3e8d4;background:#edf7f1}
.menu-card.blue{border-color:#bfdbfe;background:#eff6ff}
.menu-card.purple{border-color:#ddd6fe;background:#f5f3ff}
.menu-card.gold{border-color:#fde68a;background:#fefce8}
.menu-card.red{border-color:#fecaca;background:#fef2f2}

.sec{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px;padding-left:2px}
.cd{background:var(--w);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1.5px solid var(--b)}
.ct{font-family:'Playfair Display',serif;font-size:17px;color:var(--or);margin-bottom:12px;display:flex;align-items:center;gap:8px}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1.5px solid var(--b);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:400px}
th{background:linear-gradient(135deg,#E8650A,#C2500A);color:#fff;padding:10px 6px;text-align:center;white-space:nowrap;font-weight:700;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif}
th:first-child{text-align:left;padding-left:10px}
td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--b);font-size:12px;min-width:34px}
td:first-child{text-align:left;padding-left:10px;font-weight:600}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#fdf8f5}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-or{background:var(--orp);color:var(--or);border:1px solid var(--orm)}
.b-bl{background:#eff6ff;color:#1D4ED8;border:1px solid #bfdbfe}
.b-gr{background:#edf7f1;color:#15803D;border:1px solid #c3e8d4}
.b-rd{background:#fdf2f1;color:#c0392b;border:1px solid #fecaca}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s}
.mo.show{opacity:1;pointer-events:all}
.ms{background:var(--w);border-radius:18px 18px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom));
  width:100%;max-width:400px;max-height:72vh;overflow-y:auto;
  transform:translateY(60px);transition:transform .28s cubic-bezier(.32,1,.5,1)}
.mo.show .ms{transform:translateY(0)}
.td-sticky{position:sticky;left:0;background:#fff;z-index:2;min-width:84px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.td-sticky{background:linear-gradient(135deg,#E8650A,#C2500A);}
tr:nth-child(even) td.td-sticky{background:#fdf8f5}
.thead-sticky th{position:sticky;top:0;z-index:3}
.thead-sticky th.td-sticky{z-index:4}
.tbl-scroll-y{max-height:65vh;overflow-y:auto}
.mh{width:28px;height:3px;background:var(--b);border-radius:2px;margin:10px auto 12px}
.mt{font-family:'Playfair Display',serif;font-size:14px;color:var(--or);margin-bottom:11px}
.fg2{margin-bottom:9px}
.fg2 label{display:block;font-size:11px;font-weight:700;color:var(--tm);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.fi2{width:100%;padding:8px 10px;border:1.5px solid var(--b);border-radius:var(--rs);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--t);background:#fff;outline:none;transition:border-color .2s}
.fi2:focus{border-color:var(--orl)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-val{font-weight:700;color:var(--t)}
.info-val.or{color:var(--or)}
.mo-btns{display:flex;gap:7px;margin-top:12px}
.btn-cancel{flex:1;padding:9px;background:var(--bg);border:1.5px solid var(--b);border-radius:var(--rs);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;color:var(--tm)}
.btn-save{flex:2;padding:9px;background:linear-gradient(135deg,#E8650A,#C2500A);color:#fff;border:none;
  border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 12px rgba(194,80,10,.3)}
.btn-save:active{opacity:.85}

.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}
.li:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--orp);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--or);flex-shrink:0;border:1.5px solid var(--orm)}
.wn{font-size:14px;font-weight:700;color:var(--t)}
.ws{font-size:11px;color:var(--tl);margin-top:1px}
.bsm{padding:6px 10px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.bsm-o{background:var(--orp);color:var(--or)}
.bsm-r{background:#fdf2f1;color:#c0392b}

.kas-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--b)}
.kas-row:last-child{border-bottom:none}
.kas-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}

.legend-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tm);font-weight:600}
.leg-dot{width:22px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}

.sel-month{width:100%;padding:8px 10px;border:1.5px solid var(--orm);border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--or);background:rgba(232,101,10,.07);outline:none;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1a0e05;color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── SYNC INDICATOR ── */
.sync-bar{position:fixed;top:0;left:0;right:0;z-index:9999;height:3px;background:transparent;pointer-events:none}
.sync-bar.syncing{background:linear-gradient(90deg,var(--or),#fbbf24,var(--or));background-size:200%;animation:syncAnim 1.2s linear infinite}
@keyframes syncAnim{0%{background-position:0%}100%{background-position:200%}}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.conn-dot.online{background:#22c55e;box-shadow:0 0 6px #22c55e}
.conn-dot.offline{background:#f87171;box-shadow:0 0 6px #f87171}
.conn-dot.pending{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
#conn-status{display:flex;align-items:center;font-size:9px;color:#fff;font-weight:600;white-space:nowrap;
  background:rgba(0,0,0,.2);border-radius:6px;padding:2px 6px;gap:2px}
/* ── LOADING SCREEN ── */
#FB-LOAD{position:fixed;inset:0;background:linear-gradient(155deg,#1a0800,#5c1a00,#C2500A);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000;gap:16px}
#FB-LOAD .fl-logo{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,.3)}
#FB-LOAD .fl-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff}
#FB-LOAD .fl-sub{font-size:13px;color:rgba(255,255,255,.7)}
.fl-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl-err{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  border-radius:12px;padding:12px 18px;color:#fff;font-size:12px;text-align:center;max-width:280px;line-height:1.6}
.fl-err code{background:rgba(255,255,255,.2);border-radius:4px;padding:2px 6px;font-size:11px;display:block;margin-top:6px;word-break:break-all}

.btn-print{display:flex;align-items:center;gap:6px;padding:8px 14px;
  background:#1a0e05;color:#fff;border:none;border-radius:8px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap}
.btn-print:active{opacity:.8}
@media print{body,html{display:block!important}#LS,#APP,#MO,#TOAST{display:none!important}
  #PRINT-FRAME{display:block!important;position:static!important}}
/* ── PLASTIK UV — kartu per rumah, ramah layar sempit ────── */
.puv-locbar{display:flex;align-items:center;gap:8px;background:var(--w);border:1.5px solid var(--b);
  border-radius:var(--rs);padding:9px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.puv-locbar .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.puv-locbar b{font-family:'Playfair Display',serif;font-size:15px;color:var(--t)}
.puv-locbar span{font-size:11px;color:var(--tl)}
.puv-actionbar{display:flex;gap:8px;margin-bottom:12px}
.puv-actionbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border:none;border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12.5px;font-weight:700;cursor:pointer;color:#fff}
.puv-actionbar button:active{opacity:.85;transform:scale(.98)}
.puv-sessions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.puv-session-chip{display:flex;align-items:center;gap:6px;background:var(--w);border:1.5px solid var(--b);
  border-radius:20px;padding:5px 6px 5px 12px;font-size:11.5px;font-weight:600;color:var(--tm)}
.puv-session-chip button{width:18px;height:18px;border-radius:50%;border:none;background:#fef2f2;
  color:#c0392b;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.puv-empty-sessions{font-size:11.5px;color:var(--tl);background:var(--orp);border:1px dashed var(--orm);
  border-radius:var(--rs);padding:8px 10px;margin-bottom:14px}
.puv-card{background:var(--w);border:1.5px solid var(--b);border-radius:var(--r);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--sh)}
.puv-card-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  border-bottom:1.5px solid var(--b)}
.puv-card-head .puv-num{font-family:'Playfair Display',serif;font-size:15px;font-weight:700}
.puv-card-head button{background:transparent;border:none;color:var(--tl);opacity:.6;cursor:pointer;
  font-size:13px;padding:4px 6px;line-height:1}
.puv-sub-row{padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.puv-sub-row+.puv-sub-row{border-top:1px dashed var(--b)}
.puv-sub-tag{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:#fff}
.puv-sub-body{flex:1;min-width:0}
.puv-sub-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.puv-sub-toprow .lbl{font-size:11px;color:var(--tl);font-weight:600}
.puv-sub-toprow .btns{display:flex;gap:4px}
.puv-sub-toprow .btns button{width:20px;height:20px;border-radius:6px;border:none;cursor:pointer;
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.puv-sub-toprow .btn-del{background:#fef2f2;color:#c0392b}
.puv-sub-toprow .btn-add{background:#edf7f1;color:#1a6b3c}
.puv-dategrid{display:flex;flex-wrap:wrap;gap:6px}
.puv-datewrap{display:flex;flex-direction:column;gap:2px}
.puv-datewrap small{font-size:9px;color:var(--tl);font-weight:600;padding-left:1px}
.puv-datewrap input[type=date]{border:1.5px solid var(--b);border-radius:8px;padding:5px 6px;
  font-size:11px;width:112px;background:#fffdfb;color:var(--t);outline:none}
.puv-datewrap input[type=date]:focus{border-color:var(--or)}
.puv-noSession{font-size:11px;color:var(--tl);font-style:italic}
.puv-emptystate{text-align:center;color:var(--tl);padding:34px 16px;background:var(--w);
  border:1.5px dashed var(--b);border-radius:var(--r)}
.puv-emptystate .ti{font-size:30px;color:var(--orm);margin-bottom:8px;display:block}
/* ── PLASTIK UV — tabel excel-style, tombol edit di pojok sel ── */
.puv-actionbar2{display:flex;gap:8px;margin-bottom:10px}
.puv-actionbar2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px;border:none;border-radius:var(--rs);font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;color:#fff}
.puv-actionbar2 button:active{opacity:.85;transform:scale(.98)}
.puv-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1.5px solid var(--b)}
.puv-table{border-collapse:collapse;table-layout:fixed;min-width:0}
.puv-table th{padding:6px 4px;font-size:9.5px;font-weight:700;color:#fff;text-align:center;white-space:nowrap}
.puv-table td{padding:0;border-bottom:1px solid var(--b);vertical-align:middle;font-size:12px}
.puv-th-rumah,.puv-cell-rumah{width:60px;min-width:60px;max-width:60px}
.puv-th-sub,.puv-cell-sub{width:48px;min-width:48px;max-width:48px}
.puv-th-date,.puv-cell-date{width:66px;min-width:66px;max-width:66px}
.puv-th-merged{position:sticky;left:0;z-index:3}
.puv-cell-rumah{position:sticky;left:0;z-index:1;padding:0;border-right:1px solid var(--b);background-clip:padding-box}
.puv-cell-rumah-inner{display:flex;align-items:center;min-height:32px;padding:0 2px}
.puv-cell-rumah-inner .puv-rumah-num{flex:1;text-align:center;font-weight:700;font-size:13px}

<script>
// ══════════════════════════════════════════════════════════
// ── FIREBASE CONFIG — GANTI BAGIAN INI DENGAN CONFIG ANDA ─
// ══════════════════════════════════════════════════════════
const FB_CONFIG = {
  apiKey:            "AIzaSyCv460Mfdel6LW4waHqtScrPYMZrEImdyw",
  authDomain:        "wawanbunga-69251.firebaseapp.com",
  databaseURL:       "https://wawanbunga-69251-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "wawanbunga-69251",
  storageBucket:     "wawanbunga-69251.firebasestorage.app",
  messagingSenderId: "946840645397",
  appId:             "1:946840645397:web:c9ae42d9ca584f091b831c",
  measurementId:     "G-SYMZJNQG1S"
};
// ══════════════════════════════════════════════════════════

// ── FIREBASE ENGINE ───────────────────────────────────────
let db = null;
let fbReady = false;
let isOnline = false;
let pendingWrites = 0; // hitung write yg sedang proses

// Kunci localStorage untuk data offline
const LS_PREFIX = 'wb_offline_';
const LS_QUEUE  = 'wb_queue';   // antrian write saat offline

function fbInit() {
  try {
    const app = firebase.initializeApp(FB_CONFIG);
    db = firebase.database(app);

    // Deteksi online/offline realtime
    db.ref('.info/connected').on('value', snap => {
      isOnline = !!snap.val();
      updateConnUI(isOnline ? 'online' : 'offline');
      if (isOnline) flushOfflineQueue();
    });

    // Load semua data dari Firebase lalu tampilkan app
    fbLoadAll();
  } catch(e) {
    showFbError('Gagal inisialisasi Firebase.<br>Cek config di kode.<br><code>' + e.message + '</code>');
  }
}

function updateConnUI(state) {
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-txt');
  if (!dot) return;
  dot.className = 'conn-dot ' + state;
  txt.textContent = state === 'online' ? 'Online' : state === 'offline' ? 'Offline' : '...';
}

function setSyncing(on) {
  const bar = document.getElementById('SYNC-BAR');
  if (!bar) return;
  if (on) bar.classList.add('syncing'); else bar.classList.remove('syncing');
}

// ── LOAD SEMUA DATA DARI FIREBASE ─────────────────────────
function fbLoadAll() {
  setFlSub('Memuat data...');
  db.ref('/').once('value').then(snap => {
    const d = snap.val() || {};

    // USERS — akun pengguna
    if (d.users) {
      USERS.length = 0;
      Object.values(d.users).forEach(u => USERS.push(u));
    } else {
      // Jika belum ada user, buat akun admin default & simpan ke Firebase
      const defaultAdmin = {
        id: 'user_admin',
        name: 'Admin',
        username: 'admin',
        pass: 'admin123',
        role: 'admin'
      };
      USERS.push(defaultAdmin);
      db.ref('/users/user_admin').set(defaultAdmin);
      // Hapus akun lama yg field-nya salah (password → pass)
      db.ref('/users/user_admin/password').remove();
    }

    // Karyawan
    if (d.karyawan) karyawan = normKaryawan(d.karyawan);

    // Tarif lembur (Rp/jam)
    if (d.lemburRate) lemburRate = d.lemburRate;
    if (d.lemburRateHist) lemburRateHist = d.lemburRateHist;

    // Absen & Lembur (object flat)
    if (d.absenData)  absenData  = d.absenData;
    if (d.lemburData) lemburData = d.lemburData;

    // Kas
    if (d.kasData) kasData = d.kasData;

    // Panen
    if (d.panenData) panenData = d.panenData;

    // Obat & Drip
    if (d.obatData) obatData = d.obatData;
    if (d.dripData) dripData = d.dripData;

    // Bunga
    if (d.bunga && Array.isArray(d.bunga)) bunga = d.bunga;

    // Penjualan
    if (d.penjualanData) penjualanData = Array.isArray(d.penjualanData)
      ? d.penjualanData : Object.values(d.penjualanData);

    // Matun
    if (d.matunData) matunData = d.matunData;

    // Jumlah Tanaman
    if (d.jtData)  jtData  = d.jtData;
    if (d.jtSubs)  jtSubs  = d.jtSubs;
    jtNormalizeEmptyBlocks(); // pastikan semua blok (bukan cuma Blok A) tampil 1 baris kosong siap-isi

    // Jumlah Tanaman — Kalibanger (grid spreadsheet tersinkron)
    if (d.kalGrid)     kalGrid     = d.kalGrid;
    if (d.kalSections) kalSections = d.kalSections;
    if (d.kalMaxRow)   kalMaxRow   = d.kalMaxRow;

    // Plastik UV (digabung per-lokasi, bukan ditimpa total, supaya lokasi baru
    // seperti Sawah Gondang tidak hilang kalau data lama di Firebase belum punya lokasi itu)
    if (d.puvData)  puvData  = mergePUVData(d.puvData);
    if (d.puvCells) puvCells = mergePUVCells(d.puvCells);

    // Bedeng Setup (Matun)
    if (d.bedengSetup) bedengSetup = d.bedengSetup;

    // Absen Sawah Gondang (terpisah)
    if (d.karyawanSG)   karyawanSG   = normKaryawan(d.karyawanSG);
    if (d.absenDataSG)  absenDataSG  = d.absenDataSG;
    if (d.lemburDataSG) lemburDataSG = d.lemburDataSG;
    if (d.lemburRateSG) lemburRateSG = d.lemburRateSG;
    if (d.lemburRateSGHist) lemburRateSGHist = d.lemburRateSGHist;

    // Migrasi sekali-jalan: beri ID tetap ke karyawan & ubah kunci absen/lembur lama (nomor urut) ke ID
    migrasiIdKaryawan(true);

    // Setelah load selesai, setup listener realtime & tampilkan app
    fbSetupListeners();
    hideFbLoad();
    fbReady = true;

    // Restore session jika sudah login sebelumnya
    const savedSession = sessionStorage.getItem('wb_session');
    if (savedSession) {
      try {
        const sess = JSON.parse(savedSession);
        const user = USERS.find(x => x.id === sess.id && x.username === sess.username);
        if (user) {
          CU = user;
          currentMonth = todayYM();
          buildMonthSelector();
          document.getElementById('tb-role').textContent = roleLabel[CU.role] || CU.role;
          document.getElementById('LS').style.display = 'none';
          const app = document.getElementById('APP');
          app.style.display = 'flex';
          app.style.flexDirection = 'column';
          app.style.flex = '1';
          app.style.minHeight = '100%';
          navStack = [];
          pushNav({ title: 'Wawan Bunga', sub: 'Selamat datang, ' + CU.name, renderFn: renderHome, showBack: false });
        }
      } catch(e) { sessionStorage.removeItem('wb_session'); }
    }

    // Flush antrian offline jika ada
    if (isOnline) flushOfflineQueue();

  }).catch(e => {
    // Gagal load (mungkin offline saat pertama kali) — coba dari localStorage
    loadFromLocalStorage();
    migrasiIdKaryawan(false);
    hideFbLoad();
    fbReady = true;
    showToastWarn('⚠️ Offline — data dari penyimpanan lokal');
  });
}

// ── REALTIME LISTENERS — update otomatis saat HP lain simpan data ──
function fbSetupListeners() {
  const paths = [
    'users','karyawan','absenData','lemburData','kasData',
    'panenData','obatData','dripData','bunga','penjualanData',
    'matunData','jtData','jtSubs','puvData','puvCells','lemburRate','lemburRateHist','lemburRateSGHist',
    'karyawanSG','absenDataSG','lemburDataSG','lemburRateSG','bedengSetup',
    'kalGrid','kalSections','kalMaxRow'
  ];
  paths.forEach(path => {
    db.ref('/' + path).on('value', snap => {
      if (!fbReady) return; // abaikan event saat initial load
      applyRemoteData(path, snap.val());
    });
  });
}

function applyRemoteData(path, val) {
  if (val === null) return;
  switch(path) {
    case 'users':
      USERS.length = 0;
      Object.values(val).forEach(u => USERS.push(u));
      break;
    case 'karyawan':        karyawan      = normKaryawan(val); break;
    case 'absenData':       absenData     = val; break;
    case 'lemburData':      lemburData    = val; break;
    case 'kasData':         kasData       = val; break;
    case 'panenData':       panenData     = val; break;
    case 'obatData':        obatData      = val; break;
    case 'dripData':        dripData      = val; break;
    case 'bunga':           bunga         = Array.isArray(val) ? val : Object.values(val); break;
    case 'penjualanData':   penjualanData = Array.isArray(val) ? val : Object.values(val); break;
    case 'matunData':       matunData     = val; break;
    case 'jtData':          jtData        = val; break;
    case 'jtSubs':          jtSubs        = val; break;
    case 'kalGrid':         kalGrid       = val; break;
    case 'kalSections':     kalSections   = val; break;
    case 'kalMaxRow':       kalMaxRow     = val; break;
    case 'puvData':         puvData  = mergePUVData(val); break;
    case 'puvCells':        puvCells = mergePUVCells(val); break;
    case 'lemburRate':      lemburRate    = val; break;
    case 'karyawanSG':      karyawanSG    = normKaryawan(val); break;
    case 'absenDataSG':     absenDataSG   = val; break;
    case 'lemburDataSG':    lemburDataSG  = val; break;
    case 'lemburRateSG':    lemburRateSG  = val; break;
    case 'lemburRateHist':  lemburRateHist   = val; break;
    case 'lemburRateSGHist':lemburRateSGHist = val; break;
    case 'bedengSetup':     bedengSetup   = val; break;
  }
  // Re-render halaman aktif jika sudah login
  if (CU && navStack.length) refreshPage();
}

// ── SIMPAN KE FIREBASE (dengan fallback offline) ──────────
function fbSave(path, data) {
  // Selalu simpan ke localStorage dulu sebagai backup
  try { localStorage.setItem(LS_PREFIX + path, JSON.stringify(data)); } catch(e){}

  if (!db || !isOnline) {
    // Tambahkan ke antrian offline
    enqueueOffline(path, data);
    updateConnUI('offline');
    return Promise.resolve();
  }

  setSyncing(true);
  pendingWrites++;
  return db.ref('/' + path).set(data)
    .then(() => {
      pendingWrites--;
      if (pendingWrites <= 0) { pendingWrites=0; setSyncing(false); }
    })
    .catch(e => {
      pendingWrites--;
      if (pendingWrites <= 0) { pendingWrites=0; setSyncing(false); }
      enqueueOffline(path, data);
      showToastWarn('⚠️ Tersimpan lokal, akan sync saat online');
    });
}

// ── ANTRIAN OFFLINE ───────────────────────────────────────
function enqueueOffline(path, data) {
  let q = [];
  try { q = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch(e){}
  // Hapus entri lama untuk path yang sama (pakai data terbaru)
  q = q.filter(x => x.path !== path);
  q.push({ path, data, ts: Date.now() });
  try { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); } catch(e){}
}

function flushOfflineQueue() {
  let q = [];
  try { q = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch(e){}
  if (!q.length || !db) return;

  setSyncing(true);
  showToastWarn('🔄 Sinkronisasi data offline...');
  const writes = q.map(item =>
    db.ref('/' + item.path).set(item.data).catch(e => console.warn('flush err', item.path, e))
  );
  Promise.all(writes).then(() => {
    localStorage.removeItem(LS_QUEUE);
    setSyncing(false);
    toast('✅ Data offline berhasil disinkronkan!');
  }).catch(() => {
    setSyncing(false);
    showToastWarn('⚠️ Sebagian data belum tersinkron');
  });
}

// ── LOAD DARI LOCALSTORAGE (fallback saat offline pertama kali) ──
function loadFromLocalStorage() {
  const keys = [
    'users','karyawan','absenData','lemburData','kasData',
    'panenData','obatData','dripData','bunga','penjualanData',
    'matunData','jtData','jtSubs','puvData','puvCells',
    'karyawanSG','absenDataSG','lemburDataSG','lemburRateSG','bedengSetup',
    'lemburRate','lemburRateHist','lemburRateSGHist',
    'kalGrid','kalSections','kalMaxRow'
  ];
  keys.forEach(k => {
    try {
      const raw = localStorage.getItem(LS_PREFIX + k);
      if (raw) applyRemoteData(k, JSON.parse(raw));
    } catch(e){}
  });
}

// ── HELPERS UI LOADING ─────────────────────────────────────
function setFlSub(t) {
  const el = document.getElementById('fl-sub');
  if (el) el.textContent = t;
}
function hideFbLoad() {
  const el = document.getElementById('FB-LOAD');
  if (el) { el.style.opacity='0'; el.style.transition='opacity .4s';
    setTimeout(()=>{ el.style.display='none'; },400); }
}
function showFbError(msg) {
  const el = document.getElementById('fl-err');
  const sp = document.getElementById('fl-spin');
  if (el) { el.innerHTML = msg; el.style.display='block'; }
  if (sp) sp.style.display='none';
}
function showToastWarn(msg) {
  const t = document.getElementById('TOAST');
  if (!t) return;
  t.textContent = msg;
  t.style.background = '#b45309';
  t.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show'); t.style.background=''; }, 3000);
}

// ── FUNGSI SAVE TIAP MODUL (dipanggil setelah setiap perubahan) ──
function saveUsers()       { return fbSave('users',         arrToObj(USERS,'id')); }
function saveKaryawan()    { return fbSave('karyawan',      krToObj(karyawan)); }
function saveAbsen()       { return fbSave('absenData',     absenData); }
function saveLembur()      { return fbSave('lemburData',    lemburData); }
function saveLemburRate()  { return fbSave('lemburRate',    lemburRate); }
function saveKas()         { return fbSave('kasData',       kasData); }
function savePanen()       { return fbSave('panenData',     panenData); }
function saveObat()        { return fbSave('obatData',      obatData); }
function saveDrip()        { return fbSave('dripData',      dripData); }
function saveBunga()       { return fbSave('bunga',         bunga); }
function savePenjualan()   { return fbSave('penjualanData', penjualanData); }
function saveMatun()       { return fbSave('matunData',     matunData); }
function saveJT()          { return fbSave('jtData',        jtData); }
function saveJTSubs()      { return fbSave('jtSubs',        jtSubs); }
function savePUV()         { fbSave('puvData',puvData); fbSave('puvCells',puvCells); }
function saveKaryawanSG()   { return fbSave('karyawanSG',   krToObj(karyawanSG)); }
function saveAbsenSG()      { return fbSave('absenDataSG',  absenDataSG); }
function saveLemburSG()     { return fbSave('lemburDataSG', lemburDataSG); }
function saveLemburRateSG() { return fbSave('lemburRateSG', lemburRateSG); }
function saveLemburRateHist()   { return fbSave('lemburRateHist',   lemburRateHist); }
function saveLemburRateSGHist() { return fbSave('lemburRateSGHist', lemburRateSGHist); }
function saveBedeng()       { return fbSave('bedengSetup',  bedengSetup); }

function arrToObj(arr, keyField) {
  const o = {};
  arr.forEach((item,i) => { o[item[keyField] || i] = item; });
  return o;
}

// ══════════════════════════════════════════════════════════
// ── KARYAWAN: ID TETAP, STATUS "BERHENTI BEKERJA", MIGRASI ──
// Absen & lembur disimpan dengan kunci ID karyawan (bukan nomor urut),
// jadi menghapus/menambah orang tidak menggeser data siapa pun.
// kr.keluar = 'YYYY-MM' → bulan TERAKHIR kerja. Nama tampil di bulan tsb
// dan bulan-bulan sebelumnya, tidak tampil di bulan sesudahnya.
// ══════════════════════════════════════════════════════════
function newKrId(){ return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Firebase mengembalikan objek terurut abjad → urutkan ulang sesuai field "urut"
function normKaryawan(val){
  const arr = (Array.isArray(val) ? val : Object.values(val||{})).filter(Boolean);
  return arr.sort((a,b)=>(a.urut==null?1e9:a.urut)-(b.urut==null?1e9:b.urut));
}
// Simpan sebagai objek berkunci ID + catat urutan
function krToObj(arr){
  const o={};
  arr.forEach((k,i)=>{ if(!k.id) k.id=newKrId(); k.urut=i; o[k.id]=k; });
  return o;
}
function krAktif(kr, ym){ return (!kr.mulai || ym>=kr.mulai) && (!kr.keluar || ym<=kr.keluar); }
function krAktifRentang(kr, ymAwal, ymAkhir){ return (!kr.mulai || ymAkhir>=kr.mulai) && (!kr.keluar || ymAwal<=kr.keluar); }
function krJumlahAktif(arr, ym){ return arr.filter(k=>krAktif(k,ym)).length; }
function krLabelBulan(ym){ const p=String(ym).split('-').map(Number); return (monthN[p[1]]||'')+' '+p[0]; }
function krIdDariKunci(key){ const p=String(key).split('-'); return p[0]==='L' ? p[3] : p[2]; }

// Migrasi sekali-jalan (kunci lama "2026-07-3-15" → "2026-07-<id>-15")
function krMigrasiSet(arr, absen, lembur){
  const dipakai = new Set(arr.filter(k=>k.id).map(k=>k.id));
  arr.forEach((k,i)=>{
    if(k.id) return;
    let id='k'+String(i+1).padStart(3,'0');   // deterministik → aman kalau 2 HP migrasi bersamaan
    if(dipakai.has(id)) id=newKrId();
    k.id=id; dipakai.add(id);
  });
  const idDi = i => (arr[i] && arr[i].id) || null;
  const A={}, L={};
  Object.keys(absen||{}).forEach(key=>{
    const m=key.match(/^(\d{4}-\d{2})-(\d+)-(\d+)$/);
    if(!m){ A[key]=absen[key]; return; }
    const id=idDi(+m[2]); if(id) A[m[1]+'-'+id+'-'+m[3]]=absen[key];
  });
  Object.keys(lembur||{}).forEach(key=>{
    const m=key.match(/^L-(\d{4}-\d{2})-(\d+)-(\d+)$/);
    if(!m){ L[key]=lembur[key]; return; }
    const id=idDi(+m[2]); if(id) L['L-'+m[1]+'-'+id+'-'+m[3]]=lembur[key];
  });
  return {absen:A, lembur:L};
}
function migrasiIdKaryawan(viaDb){
  const perluK = karyawan.length>0   && karyawan.some(k=>!k.id);
  const perluS = karyawanSG.length>0 && karyawanSG.some(k=>!k.id);
  if(!perluK && !perluS) return;
  const kosongNull = o => (o && Object.keys(o).length) ? o : null;
  const payload = {};
  // Cadangan data LAMA (sebelum diubah) — bisa dibuka di Firebase: /backupMigrasi
  try {
    payload['backupMigrasi/'+Date.now()] = JSON.parse(JSON.stringify({karyawan,absenData,lemburData,karyawanSG,absenDataSG,lemburDataSG}));
  } catch(e){}
  if(perluK){
    const r = krMigrasiSet(karyawan, absenData, lemburData);
    absenData = r.absen; lemburData = r.lembur;
    payload['karyawan']   = krToObj(karyawan);
    payload['absenData']  = kosongNull(r.absen);
    payload['lemburData'] = kosongNull(r.lembur);
  }
  if(perluS){
    const r = krMigrasiSet(karyawanSG, absenDataSG, lemburDataSG);
    absenDataSG = r.absen; lemburDataSG = r.lembur;
    payload['karyawanSG']   = krToObj(karyawanSG);
    payload['absenDataSG']  = kosongNull(r.absen);
    payload['lemburDataSG'] = kosongNull(r.lembur);
  }
  Object.keys(payload).forEach(p=>{
    if(p.indexOf('backupMigrasi')===0) return;
    try{ localStorage.setItem(LS_PREFIX+p, JSON.stringify(payload[p])); }catch(e){}
  });
  const antri = ()=>Object.keys(payload).forEach(p=>enqueueOffline(p, payload[p]));
  if(viaDb && db){
    db.ref().update(payload).catch(e=>{ console.warn('migrasi gagal, diantrikan', e); antri(); });   // 1 paket atomik: semua berhasil atau tidak sama sekali
  } else antri();
  console.log('✅ Migrasi ID karyawan selesai');
}

function krAktifkan(k,i){
  const X=KRX[k], kr=X.arr[i]; if(!kr) return;

function krHapusPermanen(k,i){
  const X=KRX[k], kr=X.arr[i]; if(!kr) return;
  const keyA=Object.keys(X.absen||{}).filter(x=>krIdDariKunci(x)===kr.id);
  const keyL=Object.keys(X.lembur||{}).filter(x=>krIdDariKunci(x)===kr.id);
  const info = (keyA.length||keyL.length)
    ? `\n\n${keyA.length} catatan absen dan ${keyL.length} catatan lembur milik ${kr.nama} di SEMUA bulan ikut terhapus, dan total gaji bulan-bulan lalu akan berubah.`
    : `\n\n(Tidak ada data absen/lembur atas nama ini.)`;
  if(!confirm('HAPUS PERMANEN '+kr.nama+'?'+info+'\n\nTidak bisa dibatalkan. Jika hanya berhenti bekerja, biarkan saja di daftar ini.')) return;
  keyA.forEach(x=>delete X.absen[x]);

// ── RIWAYAT GAJI (terkunci per bulan) & BULAN MULAI KERJA ──
// kr.gajiRiwayat = { '0000-00': gaji awal, 'YYYY-MM': gaji baru berlaku mulai bulan tsb }
// Gaji suatu bulan = entri terakhir yang bulannya <= bulan itu → bulan lama tidak berubah.
// kr.mulai = 'YYYY-MM' bulan pertama kerja (kosong = sejak awal).
// Tarif lembur punya riwayat yang sama (lemburRateHist / lemburRateSGHist).
// ══════════════════════════════════════════════════════════
const KR_BULAN_AWAL = '2026-07';
function krBulanSekarang(){ const n=getNowYm(); return n<KR_BULAN_AWAL ? KR_BULAN_AWAL : n; }
function krBulanDepan(){ const p=krBulanSekarang().split('-').map(Number); return p[1]===12 ? (p[0]+1)+'-01' : p[0]+'-'+String(p[1]+1).padStart(2,'0'); }

function rateDariRiwayat(hist, sekarang, ym){
  let best=null;
  Object.keys(hist||{}).forEach(k=>{ if(k<=ym && (best===null || k>best)) best=k; });
  return best===null ? sekarang : hist[best];
}
function krGaji(kr, ym){ return rateDariRiwayat(kr.gajiRiwayat, kr.gaji, ym); }
function rateLembur(ym){ return rateDariRiwayat(lemburRateHist, lemburRate, ym); }
function rateLemburSG(ym){ return rateDariRiwayat(lemburRateSGHist, lemburRateSG, ym); }

function krSetGaji(kr, gajiBaru, dariYm){
  const h = kr.gajiRiwayat ? Object.assign({}, kr.gajiRiwayat) : {'0000-00': kr.gaji};
  h[dariYm] = gajiBaru;
  kr.gajiRiwayat = h;
  kr.gaji = krGaji(kr, '9999-99');   // kr.gaji selalu = tarif terbaru
}
function krTeksRiwayat(kr){
  if(!kr.gajiRiwayat) return '';
  return Object.keys(kr.gajiRiwayat).sort().map(k=>(k==='0000-00'?'Awal':krLabelBulan(k))+': '+fmtRp(kr.gajiRiwayat[k])).join(' → ');
}
function krInfoNaik(kr){
  if(!kr.gajiRiwayat) return '';
  const now=krBulanSekarang();
  const ks=Object.keys(kr.gajiRiwayat).filter(k=>k>now).sort();
  return ks.length ? ' · '+fmtRp(kr.gajiRiwayat[ks[0]])+' mulai '+krLabelBulan(ks[0]) : '';
}

// Daftar <option> bulan dari Juli 2026 s/d maxYm
function krOptBulan(def, maxYm, extra){
  let o=(extra||[]).map(e=>`<option value="${e.v}"${e.v===def?' selected':''}>${e.t}</option>`).join('');
  let y=2026, m=7;
  for(;;){
    const v=y+'-'+String(m).padStart(2,'0');
    if(v>maxYm) break;
    o+=`<option value="${v}"${v===def?' selected':''}>${monthN[m]} ${y}</option>`;
    if(++m>12){ m=1; y++; }
  }
  return o;
}

    X.arr.push(kr);
    hideMO(); X.render(); X.simpanKr();
    toast('✅ '+nm+' ditambahkan, mulai '+krLabelBulan(mulai));

  if(mulai && kr.keluar && mulai>kr.keluar){ toast('❌ Bulan mulai melewati bulan terakhir kerja'); return; }

  hideMO(); X.render(); X.simpanKr(); toast(info);
}

// ══════════════════════════════════════════════════════════
// ── FORMAT JAM: hanya "8:00" atau "8" (absen & lembur) ──
// Absen tersimpan "8:00". Lembur diketik dalam jam ("1:30" atau "2"),
// tersimpan dalam MENIT (sama seperti data lama, hitungan gaji tidak berubah).
// ══════════════════════════════════════════════════════════
function krParseJam(raw, maxMenit){
  const s=String(raw==null?'':raw).trim();
  const m=s.match(/^(\d{1,2})(?::([0-5]\d))?$/);
  if(!m) return null;
  const h=+m[1], mn=m[2]?+m[2]:0;
  const menit=h*60+mn;
  if(menit<=0 || menit>(maxMenit||1440)) return null;
  return {menit, teks:h+':'+String(mn).padStart(2,'0')};
}
function isiJamCepat(inputId, prevId){
  const el=document.getElementById(inputId); if(!el) return;
  el.value='8:00';
  krPreviewJam(el, prevId);
}
function mcScrollGet(){ const w=document.querySelector('#MC .tbl-wrap, #MC .puv-tablewrap'); return { x:w?w.scrollLeft:0, y:window.scrollY||window.pageYOffset||0 }; }
function mcScrollSet(pos){ const w=document.querySelector('#MC .tbl-wrap, #MC .puv-tablewrap'); if(w) w.scrollLeft=pos.x; window.scrollTo(0,pos.y); }
function krPreviewMenit(inp, outId){
  const out=document.getElementById(outId); if(!out) return;
  const v=inp.value.trim();
  if(!v){ out.textContent=''; return; }
  const n=parseInt(v,10);
  if(!/^\d+$/.test(v) || isNaN(n) || n<=0 || n>720){
    out.style.color='#c0392b';
    out.textContent='⚠️ Isi angka menit (maksimal 720 = 12 jam)';
    return;
  }
  out.style.color='var(--tl)';
  const h=Math.floor(n/60), mn=n%60;
  out.textContent = '= '+(h?h+' jam':'')+(h&&mn?' ':'')+(mn?mn+' menit':'');
}
function krPreviewJam(inp, outId, lembur){
  const out=document.getElementById(outId); if(!out) return;
  const v=inp.value.trim();
  if(!v){ out.textContent=''; return; }
  const r=krParseJam(v, lembur?720:1440);
  if(!r){
    out.style.color='#c0392b';
    out.textContent = lembur ? '⚠️ Tulis 1:30 atau 2 (maksimal 12 jam)' : '⚠️ Format salah — tulis 8:00 atau 8';
    return;
  }
  out.style.color='var(--tl)';
  const h=Math.floor(r.menit/60), mn=r.menit%60;
  out.textContent = '= '+(h?h+' jam':'')+(h&&mn?' ':'')+(mn?mn+' menit':'')+(lembur?' ('+r.menit+' menit)':'');
}

// ── HISTORY STACK ─────────────────────────────────────────
// Each entry: { title, sub, renderFn, showBack, showLogo }
let navStack = [];

function pushNav(entry) {
  currentMonth = todayYM();
  navStack.push(entry);
  applyNav(entry);
  // push browser history state so phone back button works
  history.pushState({ idx: navStack.length - 1 }, '', '');
}

function applyNav(entry) {
  document.getElementById('tb-title').textContent = entry.title;
  document.getElementById('tb-sub').textContent = entry.sub || '';
  document.getElementById('btn-back').style.display = entry.showBack ? 'flex' : 'none';
  document.getElementById('tb-logo').style.display = entry.showBack ? 'none' : 'flex';
  CURRENT_LOC = null;
  entry.renderFn();
  applyReadOnlyGuard();
}

function goBack() {
  if (navStack.length <= 1) return;
  navStack.pop();
  const entry = navStack[navStack.length - 1];
  applyNav(entry);
}

// Phone/browser back button
window.addEventListener('popstate', function(e) {
  if (navStack.length > 1) {
    navStack.pop();
    const entry = navStack[navStack.length - 1];
    applyNav(entry);
    history.pushState({ idx: navStack.length - 1 }, '', '');
  }
});

function refreshPage() {
  if (navStack.length) {
    const top = navStack[navStack.length - 1];
    top.renderFn();
    applyReadOnlyGuard();
  }
}

  const now = new Date();

  const now = new Date();

}

// Build month selector options dynamically (2 years back to 1 year forward)
function buildMonthSelector() {
  const sel = document.getElementById('month-sel');
  if (!sel) return;
  const now = new Date();
  const opts = [];
  for (let y = now.getFullYear()-1; y <= now.getFullYear()+1; y++) {
    for (let mo = 1; mo <= 12; mo++) {
      const val = `${y}-${String(mo).padStart(2,'0')}`;
      const lbl = `${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][mo-1]} ${String(y).slice(2)}`;
      opts.push(`<option value="${val}"${val===currentMonth?' selected':''}>${lbl}</option>`);
    }
  }
  sel.innerHTML = opts.join('');
}

function doLogout() {
  sessionStorage.removeItem('wb_session');
  document.getElementById('APP').style.display = 'none';
  document.getElementById('LS').style.display = 'flex';
  document.getElementById('lerr').style.display = 'none';
  navStack = [];
}

function getDays(ym) {
  const [y,m] = ym.split('-').map(Number);
  const n = new Date(y,m,0).getDate();
  const r = [];
  for (let d=1;d<=n;d++) r.push({d, day: new Date(y,m-1,d).getDay()});
  return r;
}
function parseTime(v) {
  if (!v) return 0; v = v.toString().trim();
  if (v.includes(':')) { const [h,mn] = v.split(':').map(Number); return (h||0)*60+(mn||0); }
  return parseFloat(v)*60||0;
}
function fmtMins(m) { if (!m) return '-'; const h=Math.floor(m/60),mn=m%60; return mn?`${h}:${String(mn).padStart(2,'0')}`:`${h}:00`; }
function fmtRp(n) { return 'Rp'+Math.round(n||0).toLocaleString('id-ID'); }
function initials(n) { return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function toast(msg) { const t=document.getElementById('TOAST'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function fmtTgl(s) { if(!s) return '-'; const p=s.split('-'); if(p.length<3) return s; return `${parseInt(p[2])} ${monthN[parseInt(p[1])||0]||''} ${p[0]}`; }
function getWeeks(days) {
  const wks=[];let cur=[];
  days.forEach(({d,day})=>{
    cur.push(d);
    if(day===5){wks.push(cur);cur=[];}
  });
  if(cur.length)wks.push(cur);
  return wks.length?wks:[days.map(x=>x.d)];
}

function renderAbsensi() {
  clampToAbsenMonth();
  const _sl=mcScrollGet();
  const days = getDays(currentMonth);
  const [y,m] = currentMonth.split('-').map(Number);
  let html = `<div class="legend-row">
    <div class="leg-item"><div class="leg-dot" style="background:#eff6ff;color:#1D4ED8">I</div>Ijin</div>
    <div class="leg-item"><div class="leg-dot" style="background:#edf7f1;color:#15803D">S</div>Sakit</div>
    <div class="leg-item"><div class="leg-dot" style="background:#fdf2f1;color:#c0392b">A</div>Tanpa Ket</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f5f3ff;color:#9333EA">B</div>Diliburkan</div>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:10px">
    <button class="btn-save" style="flex:1;padding:9px 14px;font-size:13px;border:none;cursor:pointer" onclick="openAbsenBatch()"><i class="ti ti-plus" aria-hidden="true"></i> Input Cepat</button>
    <button class="btn-print" onclick="printAbsensi()"><i class="ti ti-printer"></i> Print</button>
  </div>
  <select onchange="currentMonth=this.value;renderAbsensi()" class="sel-month" style="margin-bottom:10px">
    ${buildMonthOptsAbsen(currentMonth)}
  </select>
  <div class="tbl-wrap tbl-scroll-y"><table><thead class="thead-sticky"><tr><th class="td-sticky">Nama</th>`;
  days.forEach(({d,day})=>{const we=day===0||day===6;html+=`<th style="${we?'background:rgba(0,0,0,.25)':''}">${d}<br>${dayN[day]}</th>`;});
  html+=`<th>Jam</th></tr></thead><tbody>`;
  karyawan.forEach((kr,ki)=>{if(!krAktif(kr,currentMonth))return;
    let tot=0;
    html+=`<tr><td class="td-sticky" onclick="openAbsenBatch(${ki})" style="cursor:pointer">${kr.nama}</td>`;
    days.forEach(({d,day})=>{
      const k=`${currentMonth}-${karyawan[ki].id}-${d}`;
      const v=(absenData[k]||'').toUpperCase();
      const we=day===0||day===6;
      let st=we?'background:#fdf8f5;':'';
      if(absenStyle[v])st+=absenStyle[v];
      if(v&&!absenColors[v]){tot+=parseTime(v);if(!krParseJam(v))st+='outline:2px solid #c0392b;outline-offset:-2px;';}
      html+=`<td style="${st};cursor:pointer" onclick="openAbsenModal(${ki},${d},'${k}')">${v||''}</td>`;
    });
    html+=`<td style="font-weight:700;color:var(--or)">${fmtMins(tot)}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById('MC').innerHTML=html;
  mcScrollSet(_sl);
  applyReadOnlyGuard();
}

// Build month <option> list (2 yr back to 1 yr forward), selected = cur
// Menampilkan hanya bulan sebelumnya + bulan berjalan. Bulan depan otomatis muncul
// begitu tanggal sistem sudah memasuki bulan tersebut.
function getNowYm(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}
function clampToAbsenMonth(){const nowYm=getNowYm();if(currentMonth>nowYm)currentMonth=nowYm;}
function buildMonthOptsAbsen(cur) {
  const lbls = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const now=new Date();
  const nowYm=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let opts='';
  for(let y=2026;y<=2027;y++){
    for(let mo=1;mo<=12;mo++){
      if(y===2026 && mo<7) continue; // mulai Juli 2026
      const val=`${y}-${String(mo).padStart(2,'0')}`;
      if(val>nowYm) continue; // sembunyikan bulan yang belum tiba
      opts+=`<option value="${val}"${val===cur?' selected':''}>${lbls[mo-1]} ${y}</option>`;
    }
  }
  return opts;
}

function openAbsenModal(ki,d,key){
  const kr=karyawan[ki];const[y,m]=currentMonth.split('-').map(Number);
  const dt=new Date(y,m-1,d);const cur=(absenData[key]||'').toUpperCase();
  moCtx={type:'absen',key,ki,d};
  document.getElementById('mo-title').textContent='Input Absen';
  document.getElementById('mo-body').innerHTML=`
    <div class="info-row"><span style="color:var(--tl)">Nama</span><span class="info-val">${kr.nama}</span></div>
    <div class="info-row"><span style="color:var(--tl)">Tanggal</span><span class="info-val or">${d} ${monthN[m]} — ${dayN[dt.getDay()]}</span></div>
    <div style="height:4px"></div>
    <div class="fg2"><label>Jenis Kehadiran</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select class="fi2" id="mo-jenis" onchange="toggleJam(this.value)" style="flex:1">

// ── REKAP ─────────────────────────────────────────────────
// ── KALENDER JAWA (Sultan Agung) ──────────────────────────
// Epoch: 1 Suro 1555 AJ = 8 Juli 1633 M (Gregorian)
// Terverifikasi: 1 Jan 2025 = 1958 AJ bulan Jumadil Akhir
const LOKNAMA = ['','Kalibanger','Tegal Roto','Ngadikerso','Sawah Gondang'];
const JAWA_BULAN = ['Suro','Sapar','Mulud','Bakda Mulud','Jumadil Awal','Jumadil Akhir','Rejeb','Ruwah','Pasa','Sawal','Dulkangidah','Besar'];

function isKabisatJawa(t) { return [2,5,8].includes(((t-1)%8)+1); }
function panjangTahunJawa(t) { return isKabisatJawa(t)?355:354; }
function panjangBulanJawa(b,t) { if(b===11)return isKabisatJawa(t)?30:29; return b%2===0?30:29; }

function jdnGregorian(y,m,d) {
  const g=y>1582||(y===1582&&m>10)||(y===1582&&m===10&&d>=15);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d-1524-(g?Math.floor(y/100)-Math.floor(y/400)+2:0);
}
function jdnToGregorian(jdn) {
  let a=jdn+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4);
  let dd=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*dd/4),mm=Math.floor((5*e+2)/153);
  return {year:100*b+dd-4800+Math.floor(mm/10),month:mm+3-12*Math.floor(mm/10),day:e-Math.floor((153*mm+2)/5)+1};
}

// Epoch: 1 Suro 1555 AJ = 8 Juli 1633 M
const EPOCH_JDN_JAWA = jdnGregorian(1633,7,8);
const EPOCH_TAHUN_AJ = 1555;

function jawaKeGregorian(tahunAJ,bulanIdx,tgl) {
  let h=0;
  for(let t=EPOCH_TAHUN_AJ;t<tahunAJ;t++) h+=panjangTahunJawa(t);
  for(let b=0;b<bulanIdx;b++) h+=panjangBulanJawa(b,tahunAJ);
  h+=(tgl-1);
  return jdnToGregorian(EPOCH_JDN_JAWA+h);
}

function gregorianKeJawa(year,month,day) {
  let h=jdnGregorian(year,month,day)-EPOCH_JDN_JAWA;
  let tahunAJ=EPOCH_TAHUN_AJ;
  while(true){const py=panjangTahunJawa(tahunAJ);if(h<py)break;h-=py;tahunAJ++;}
  let bulanIdx=0;
  while(true){const pb=panjangBulanJawa(bulanIdx,tahunAJ);if(h<pb)break;h-=pb;bulanIdx++;}
  return {tahunAJ,bulanIdx,tglJawa:h+1};
}

function getDaysBulanJawa(tahunAJ,bulanIdx) {
  const result=[];
  for(let tgl=1;tgl<=panjangBulanJawa(bulanIdx,tahunAJ);tgl++){
    const g=jawaKeGregorian(tahunAJ,bulanIdx,tgl);
    const dt=new Date(g.year,g.month-1,g.day);
    result.push({tglJawa:tgl,masehi:g,ym:`${g.year}-${String(g.month).padStart(2,'0')}`,d:g.day,dayOfWeek:dt.getDay()});
  }
  return result;
}

function getBulanJawaSekarang() {
  const now=new Date();
  return gregorianKeJawa(now.getFullYear(),now.getMonth()+1,now.getDate());
}

// ── REKAP (Sawah Gondang) — pakai kalender Jawa & state global yang sama ──
function renderRekapSG(){
  CURRENT_LOC = 4;
  if(!rekapJawaTahun) initRekapJawa();
  const tahunAJ=rekapJawaTahun, bulanIdx=rekapJawaBulan;
  const namaBulan=JAWA_BULAN[bulanIdx];
  const hariList=getDaysBulanJawa(tahunAJ,bulanIdx);

  // Dropdown: ±1 tahun Jawa dari sekarang
  const jsNow=getBulanJawaSekarang();
  let optsHtml='';
  for(let dy=-1;dy<=1;dy++){
    const tAJ=jsNow.tahunAJ+dy; if(tAJ<EPOCH_TAHUN_AJ) continue;
    for(let b=0;b<12;b++){
      const sel=(tAJ===tahunAJ&&b===bulanIdx)?'selected':'';
      // Konversi tahunAJ ke tahun Masehi: ambil tahun Masehi dari 1 tgl bulan tsb
      const gOpt=jawaKeGregorian(tAJ,b,1);
      optsHtml+=`<option value="${tAJ}_${b}" ${sel}>${JAWA_BULAN[b]} ${gOpt.year}</option>`;
    }
  }

  // Periode Masehi
  const mulai=hariList[0].masehi, akhir=hariList[hariList.length-1].masehi;
  const periodeStr=`${mulai.day} ${monthN[mulai.month]} ${mulai.year} – ${akhir.day} ${monthN[akhir.month]} ${akhir.year}`;

  // Layout: baris = karyawanSG, kolom = tanggal Jawa
  // Header kolom: 2 baris (Masehi + Jawa)
  const thNama = `<th rowspan="2" style="position:sticky;left:0;z-index:3;background:linear-gradient(135deg,#E8650A,#C2500A);min-width:90px;text-align:left;padding-left:8px;font-size:10px">Nama</th>
    <th rowspan="2" style="position:sticky;left:90px;z-index:3;background:linear-gradient(135deg,#E8650A,#C2500A);min-width:62px;text-align:center;font-size:10px">Total<br>Jam</th>`;
  const thMasehi = hariList.map(({masehi,d,dayOfWeek})=>{
    const isWe=dayOfWeek===0||dayOfWeek===6;
    return `<th style="font-size:9px;font-weight:600;min-width:44px;${isWe?'background:rgba(0,0,0,.25)':''}">${d}<br>${monthN[masehi.month].slice(0,3)}</th>`;
  }).join('');
  const thJawa = hariList.map(({tglJawa,dayOfWeek})=>{
    const isWe=dayOfWeek===0||dayOfWeek===6;
    return `<th style="font-size:9px;font-weight:400;${isWe?'background:rgba(0,0,0,.25)':''}">${tglJawa}</th>`;
  }).join('');

  // Baris per karyawanSG
  let bodyHtml='';
  karyawanSG.forEach((kr,ki)=>{if(!krAktifRentang(kr,hariList[0].ym,hariList[hariList.length-1].ym))return;
    let totJ=0;
    const cells=hariList.map(({ym,d,dayOfWeek})=>{
      const isWe=dayOfWeek===0||dayOfWeek===6;
      const bg=isWe?'background:#fdf8f5':'';
      const v=(absenDataSG[`${ym}-${karyawanSG[ki].id}-${d}`]||'').toUpperCase();
      let tampil='';
      if(v&&absenColors[v]){
        const bm={I:'b-or',S:'b-bl',A:'b-rd',B:'b-gr'};
        tampil=`<span class="badge ${bm[v]||'b-or'}" style="font-size:9px">${v}</span>`;
      } else if(v){
        totJ+=parseTime(v);
        tampil=`<span style="color:var(--or);font-weight:700;font-size:10px">${v}</span>`;
      } else {
        tampil=`<span style="color:#ddd;font-size:10px">·</span>`;
      }
      return `<td style="text-align:center;padding:4px 2px;${bg}">${tampil}</td>`;
    }).join('');
    const bonus=totJ/60>=192;

function printRekapJawaSG(){
  const tahunAJ=rekapJawaTahun||getBulanJawaSekarang().tahunAJ;
  const bulanIdx=(rekapJawaBulan!==undefined&&rekapJawaTahun)?rekapJawaBulan:getBulanJawaSekarang().bulanIdx;
  const namaBulan=JAWA_BULAN[bulanIdx];
  const hariList=getDaysBulanJawa(tahunAJ,bulanIdx);
  const mulai=hariList[0].masehi,akhir=hariList[hariList.length-1].masehi;
  const periodeStr=`${mulai.day} ${monthN[mulai.month]} ${mulai.year} – ${akhir.day} ${monthN[akhir.month]} ${akhir.year}`;
  const thMas=hariList.map(({masehi,d})=>`<th>${d}/${masehi.month}</th>`).join('');
  const thJw=hariList.map(({tglJawa})=>`<th>${tglJawa}</th>`).join('');
  let tBody='';
  karyawanSG.forEach((kr,ki)=>{if(!krAktifRentang(kr,hariList[0].ym,hariList[hariList.length-1].ym))return;
    let totJ=0;
    const cells=hariList.map(({ym,d})=>{
      const v=(absenDataSG[`${ym}-${karyawanSG[ki].id}-${d}`]||'').toUpperCase();
      if(v&&!absenColors[v])totJ+=parseTime(v);
      return `<td class="c">${v||'–'}</td>`;
    }).join('');
    const bonus=totJ/60>=192;
    tBody+=`<tr><td>${kr.nama}</td><td class="c"><b>${fmtMins(totJ)}</b><br>${bonus?'BONUS':'TIDAK'}</td>${cells}</tr>`;
  });
  const html=PX.open(`Rekap ${namaBulan} ${tahunAJ} AJ`)
    +PX.header(`Rekap Karyawan — ${namaBulan} ${tahunAJ} AJ`,`Periode: ${periodeStr} · *Bonus jika total jam masuk ≥ 192 jam/bulan`)
    +`<table><thead><tr><th class="l">Nama</th><th>Total</th>${thMas}</tr><tr><th></th><th></th>${thJw}</tr></thead>
       <tbody>${tBody}</tbody></table>`
    +PX.close();
  PX.doOpen(html);
}

function renderGajiSG(){
  CURRENT_LOC = 4;
  clampToAbsenMonth();
  const days=getDays(currentMonth);const wks=getWeeks(days);const[y,m]=currentMonth.split('-').map(Number);
  // month selector prepend
  let monthSel=`<div style="display:flex;gap:6px;margin-bottom:12px">
    <select onchange="currentMonth=this.value;renderGajiSG()" class="sel-month" style="flex:1">
      ${buildMonthOptsAbsen(currentMonth)}
    </select>
    <button class="btn-print" onclick="printGajiSG()"><i class="ti ti-printer"></i> Print</button>
  </div>`;

  // Build per-karyawanSG data: { gP per week, gL per week, total }
  const krData = karyawanSG.map((kr,ki)=>({kr,ki})).filter(({kr})=>krAktif(kr,currentMonth)).map(({kr,ki})=>{
    let totalGaji=0, totalLem=0;
    const weeks = wks.map((wk,wi)=>{
      let tM=0,tL=0;
      wk.forEach(d=>{
        const v=(absenDataSG[`${currentMonth}-${karyawanSG[ki].id}-${d}`]||'').toUpperCase();
        if(v&&!absenColors[v])tM+=parseTime(v);
        tL+=parseInt(lemburDataSG[`L-${currentMonth}-${karyawanSG[ki].id}-${d}`]||0);
      });
      const gP=Math.round(krGaji(kr,currentMonth)*(tM/480));
      const gL=Math.round(tL*(rateLemburSG(currentMonth)/60));
      totalGaji+=gP+gL; totalLem+=tL;
      return {tM,tL,gP,gL,tot:gP+gL};
    });
    return {kr,ki,weeks,totalGaji,totalLem};
  });

  const wkHeaders = wks.map((wk,i)=>`<th colspan="2" style="text-align:center">Minggu ${i+1}<br><span style="font-weight:400;font-size:9px">${wk[0]}–${wk[wk.length-1]}</span></th>`).join('');
  const wkSubHeaders = wks.map(()=>`<th style="font-size:9px">Pokok</th><th style="font-size:9px">Lembur</th>`).join('');

  let html=`
  <div class="cd" style="padding:0;overflow:hidden">
    <div style="padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center">
      <div class="ct" style="margin:0"><i class="ti ti-cash" aria-hidden="true"></i>Gaji ${monthN[m]} ${y}</div>
    </div>
    <div class="tbl-wrap">
    <table style="min-width:${320+wks.length*120}px">
      <thead>
        <tr>
          <th rowspan="2" class="td-sticky" style="text-align:left;min-width:110px;max-width:130px">Nama</th>
          <th rowspan="2" style="min-width:90px">Total Bulan</th>
          ${wkHeaders}
        </tr>
        <tr>${wkSubHeaders}</tr>
      </thead>
      <tbody>`;

  let grandTotal=0;
  krData.forEach(({kr,weeks,totalGaji})=>{
    grandTotal+=totalGaji;
    html+=`<tr>
      <td class="td-sticky" style="font-weight:700;min-width:110px;max-width:130px;white-space:normal">${kr.nama}<br><span class="badge ${kr.tipe==='bulanan'?'b-bl':'b-or'}" style="font-size:9px;margin-top:2px;display:inline-block">${kr.tipe==='bulanan'?'Bln':'Mgg'}</span></td>
      <td style="font-weight:700;color:var(--or);text-align:center">${fmtRp(totalGaji)}</td>
      ${weeks.map(w=>`<td style="text-align:center">${w.gP?fmtRp(w.gP):'-'}</td><td style="text-align:center;color:${w.gL?'#1D4ED8':'var(--tl)'}">${w.gL?fmtRp(w.gL):'-'}</td>`).join('')}
    </tr>`;
  });

  html+=`</tbody>
      <tfoot>
        <tr style="background:var(--orp)">
          <td class="td-sticky" style="font-weight:700;color:var(--or);min-width:110px;max-width:130px;background:var(--orp)">TOTAL</td>
          <td style="font-weight:700;color:var(--or);text-align:center">${fmtRp(grandTotal)}</td>
          ${wks.map((_,wi)=>{
            const wTot=krData.reduce((s,{weeks})=>s+weeks[wi].gP,0);
            const lTot=krData.reduce((s,{weeks})=>s+weeks[wi].gL,0);
            return `<td style="font-weight:700;text-align:center">${fmtRp(wTot)}</td><td style="font-weight:700;text-align:center;color:#1D4ED8">${lTot?fmtRp(lTot):'-'}</td>`;
          }).join('')}
        </tr>
      </tfoot>
    </table>
    </div>
    <div style="padding:10px 14px;font-size:11px;color:var(--tl);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <span>*Lembur = Rp${rateLemburSG(currentMonth).toLocaleString('id-ID')}/jam · Gaji pokok = (jam/8jam)×gaji harian</span>
      <button onclick="openLemburRateEditSG()" style="background:var(--orp);border:1px solid var(--orm);color:var(--or);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif"><i class="ti ti-settings" aria-hidden="true"></i> Atur Tarif</button>
    </div>
  </div>`;

  document.getElementById('MC').innerHTML=monthSel+html;
}

function openPanenMO(t,d){
  const days=getDays(currentMonth);const[y,m]=currentMonth.split('-').map(Number);
  const mm=String(m).padStart(2,'0');
  const todayD=new Date().getDate();

  const maxDate=`${y}-${mm}-${String(days.length).padStart(2,'0')}`;
  const defDate=`${y}-${mm}-${String(selD).padStart(2,'0')}`;

  bhtml+=`<div class="fg2"><label>Bunga Rusak</label><div style="display:flex;gap:6px;align-items:center"><input class="fi2" type="number" id="pn-rusak" value="${panenData[t][`P-${currentMonth}-${t}-${selD}-rusak`]||''}" placeholder="0" style="flex:1"><button class="bsm bsm-r" style="flex-shrink:0" onclick="hapusPanenRusak(${t})" title="Hapus"><i class="ti ti-trash" aria-hidden="true"></i></button></div></div>`;

function refreshPanenFields(t){

function hapusPanenRusak(t){

}

function renderKas(tp){
  CURRENT_LOC = (typeof tp==='string' && tp.includes('gondang')) ? 4 : null;
  clampToAbsenMonth();
  const[y,m]=currentMonth.split('-').map(Number);
  // filter transaksi bulan ini
  const allRows=kasData[tp]||[];
  const rows=allRows.filter(r=>{
    if(!r.tgl)return false;
    const rv=r.tgl.split('-');
    return rv.length===3?rv[0]==y&&parseInt(rv[1])==m:true;
  });
  let saldo=0;rows.forEach(r=>{saldo+=(r.masuk||0)-(r.keluar||0);});
  const nm=KAS_LABEL[tp]||tp;
  let html=`<div style="display:flex;gap:6px;margin-bottom:8px">
    <button class="btn-save" style="flex:1;padding:9px 14px;font-size:13px;border:none;cursor:pointer" onclick="openKasMO('${tp}',-1)"><i class="ti ti-plus" aria-hidden="true"></i> Tambah</button>
    <button class="btn-print" onclick="printKas('${tp}')"><i class="ti ti-printer"></i> Print</button>
  </div>
  <select class="sel-month" style="margin-bottom:10px" onchange="currentMonth=this.value;renderKas('${tp}')">
    ${buildMonthOptsAbsen(currentMonth)}
  </select>
  <div style="background:var(--orp);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:11px;color:var(--tl);font-weight:700;text-transform:uppercase">Saldo ${monthN[m]} ${y}</div>
      <div style="font-size:20px;font-weight:700;color:var(--or)">${fmtRp(saldo)}</div>
    </div>
    <div style="text-align:right;font-size:11px;color:var(--tl)">
      <div style="color:#1a6b3c;font-weight:700">+${fmtRp(rows.reduce((s,r)=>s+(r.masuk||0),0))}</div>
      <div style="color:#c0392b;font-weight:700">-${fmtRp(rows.reduce((s,r)=>s+(r.keluar||0),0))}</div>
    </div>
  </div>
  <div class="cd">`;
  if(!rows.length)html+=`<div style="text-align:center;padding:20px;color:var(--tl);font-size:13px">Belum ada transaksi bulan ini</div>`;
  // cari index asli di allRows untuk edit/hapus
  rows.forEach(r=>{

let penjualanData = [];

function renderPenjualan(){
  clampToAbsenMonth();
  const [y,m] = currentMonth.split('-').map(Number);
  const rows = penjualanData.filter(r=>{
    if(!r.tgl) return false;
    const p=r.tgl.split('-');
    return parseInt(p[0])===y && parseInt(p[1])===m;
  });
  const totalBulan = rows.reduce((s,r)=>s+(parseFloat(r.jumlah||0)*parseFloat(r.harga||0)),0);
  const bungaOpts = `<option value="">-- Pilih Bunga --</option>${bunga.map(b=>`<option value="${b}">${b}</option>`).join('')}`;

  let html=`
  <div style="display:flex;gap:6px;margin-bottom:8px">
    <button class="btn-save" style="flex:1;padding:9px 14px;font-size:13px;border:none;cursor:pointer" onclick="openPenjualanMO(-1)">
      <i class="ti ti-plus" aria-hidden="true"></i> Tambah
    </button>
    <button class="btn-print" onclick="printPenjualan()"><i class="ti ti-printer"></i> Print</button>
  </div>
  <select onchange="currentMonth=this.value;renderPenjualan()" class="sel-month" style="margin-bottom:8px">
    ${buildMonthOptsAbsen(currentMonth)}
  </select>
  <div style="background:var(--orp);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase">Total Penjualan ${monthN[m]} ${y}</div>
    <div style="font-size:20px;font-weight:700;color:var(--or)">${fmtRp(totalBulan)}</div>
  </div>`;

  if(!rows.length){
    html+=`<div class="cd" style="text-align:center;padding:20px;color:var(--tl)">Belum ada data penjualan bulan ini</div>`;
  } else {
    rows.forEach((r,i)=>{
      const ai = penjualanData.indexOf(r);
      const total = parseFloat(r.jumlah||0)*parseFloat(r.harga||0);
      html+=`<div class="cd" style="padding:8px 10px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:700;color:var(--or);white-space:nowrap">Tanggal: ${fmtTgl(r.tgl)}</span>
          ${r.nama?`<span style="font-size:11px;color:var(--tm)">Nama: ${r.nama}</span>`:''}
          ${r.bunga?`<span style="font-size:11px;color:#7C3AED">Bunga: ${r.bunga}</span>`:''}
          ${r.jumlah?`<span style="font-size:11px;color:var(--tl)">Jumlah: ${r.jumlah} tangkai</span>`:''}
          ${r.harga?`<span style="font-size:11px;color:var(--tl)">Harga: ${fmtRp(r.harga)}</span>`:''}
          ${total?`<span style="font-size:11px;font-weight:700;color:#1a6b3c">Penjualan: ${fmtRp(total)}</span>`:''}
          <span style="margin-left:auto;display:flex;gap:4px;flex-shrink:0">
            <button class="bsm bsm-o" style="padding:4px 8px;font-size:11px" onclick="openPenjualanMO(${ai})" aria-label="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
            <button class="bsm bsm-r" style="padding:4px 8px;font-size:11px" onclick="penjualanData.splice(${ai},1);savePenjualan();renderPenjualan()" aria-label="Hapus"><i class="ti ti-trash" aria-hidden="true"></i></button>
          </span>
        </div>
      </div>`;
    });
  }

function renderBedengSetup(locs) {
  locs = locs || [1,2,3];
  const lokNames = {1:'Kalibanger',2:'Tegalroto',3:'Ngadikerso',4:'Sawah Gondang'};
  let html = `<div class="sec" style="margin-top:4px">Bedeng Database</div>`;
  locs.forEach(t=>{
    const s = bedengSetup[t];
    html += `<div class="cd" style="margin-bottom:12px">
      <div class="ct"><i class="ti ti-database" aria-hidden="true"></i>${lokNames[t]}</div>
      <div class="fg2">
        <label>Total Kapasitas Bedeng</label>
        <input class="fi2" type="number" id="bkap-${t}" value="${s.kapasitas||''}" placeholder="cth: 120" onchange="bedengSetup[${t}].kapasitas=parseFloat(this.value)||0;saveBedeng();toast('💾 Tersimpan')">
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Alokasi Pekerja</div>`;
    s.pekerja.forEach((p,pi)=>{
      const isLast = pi === s.pekerja.length-1;
      const canDelete = isLast && s.pekerja.length > 1;
      html+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:7px">
        <div style="font-size:11px;font-weight:700;color:var(--tl);min-width:20px">P${pi+1}</div>
        <input class="fi2" type="text" placeholder="Nama pekerja" value="${p.nama||''}" style="flex:2"
          onchange="bedengSetup[${t}].pekerja[${pi}].nama=this.value;saveBedeng();toast('💾 Tersimpan')">
        <input class="fi2" type="number" placeholder="Luas" value="${p.luas||''}" style="flex:1;min-width:60px"
          onchange="bedengSetup[${t}].pekerja[${pi}].luas=parseFloat(this.value)||0;saveBedeng();toast('💾 Tersimpan')">
        ${canDelete?`<button class="bsm bsm-r" style="flex-shrink:0" onclick="hapusPekerjaBedeng(${t})" title="Hapus pekerja terakhir"><i class="ti ti-trash" aria-hidden="true"></i></button>`:''}
      </div>`;
    });
    html+=`<button class="btn-save" style="width:100%;padding:7px;font-size:12px;border:none;cursor:pointer;background:#7C3AED;margin-top:2px" onclick="tambahPekerjaBedeng(${t})"><i class="ti ti-plus" aria-hidden="true"></i> Tambah Pekerja</button>`;
    // summary
    const totalAlok = s.pekerja.reduce((sum,p)=>sum+(p.luas||0),0);
    const sisa = (s.kapasitas||0) - totalAlok;
    html+=`<div style="font-size:11px;color:var(--tl);margin-top:6px;padding-top:6px;border-top:1px solid var(--b);display:flex;gap:12px">
      <span>Total Alokasi: <strong style="color:var(--or)">${totalAlok}</strong></span>
      <span>Kapasitas: <strong>${s.kapasitas||0}</strong></span>
      <span>Sisa: <strong style="color:${sisa<0?'#c0392b':'#1a6b3c'}">${sisa}</strong></span>
    </div>
    </div>`;
  });
  document.getElementById('MC').innerHTML = html;
}
function renderBedengSetupSG() { renderBedengSetup([4]); }
function tambahPekerjaBedeng(t){
  if(!canEditLoc(t)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  bedengSetup[t].pekerja.push({nama:'',luas:0});
  renderBedengSetup(t===4?[4]:[1,2,3]);
  saveBedeng();
  toast('✅ Pekerja ditambahkan');
}
function hapusPekerjaBedeng(t){
  if(!canEditLoc(t)){toast('🔒 Anda hanya punya akses lihat di sini');return;}
  const s = bedengSetup[t];
  if(s.pekerja.length<=1){toast('⚠️ Minimal 1 pekerja');return;}
  const lastIdx = s.pekerja.length-1;
  const nm = s.pekerja[lastIdx].nama || `P${lastIdx+1}`;
  if(!confirm(`Hapus pekerja terakhir (${nm})? Data harian matun yang sudah diinput untuk pekerja ini tidak akan otomatis terhapus dari penyimpanan, tapi tidak akan tampil lagi di tabel.`))return;
  s.pekerja.pop();
  renderBedengSetup(t===4?[4]:[1,2,3]);
  saveBedeng();
  toast('🗑️ Pekerja dihapus');
}

// ── MATUN RENDER ──────────────────────────────────────────
function renderMatun(t) {
  CURRENT_LOC = t;
  clampToAbsenMonth();
  const _sl=mcScrollGet();
  const days = getDays(currentMonth);
  const [y,m] = currentMonth.split('-').map(Number);
  const conf = MATUN_CONF[t];
  const setup = bedengSetup[t];
  const np = setup.pekerja.length;
  const hc = conf.hybridCount;

  function getAkumLuas(pi, upToD) {
    let tot=0;
    for(let d=1;d<=upToD;d++) tot+=parseFloat(matunData[t][`MT-${currentMonth}-${t}-${d}-${pi}`]||0);
    return tot;
  }
  function getSisaTotal(upToD) {
    let totAkum=0;
    for(let pi=0;pi<np;pi++) totAkum+=getAkumLuas(pi,upToD);
    return (setup.kapasitas||0)-totAkum;
  }

  const lastD = days[days.length-1].d;
  const sisaTot = getSisaTotal(lastD);
  const kap = setup.kapasitas||0;
  const sisPct = kap>0 ? Math.round((sisaTot/kap)*100) : 0;

  // Build header
  let thPekerja='';
  for(let pi=0;pi<np;pi++){
    const nm=setup.pekerja[pi]?.nama||`P${pi+1}`;
    const isHybrid=pi<hc;
    const cols=isHybrid?3:4;
    thPekerja+=`<th colspan="${cols}" style="background:rgba(124,58,237,.75);min-width:${cols*55}px">${nm}</th>`;
  }

  // Tombol input cepat per pekerja
  const todayD = new Date().getDate();
  const mm = String(m).padStart(2,'0');
  let btnPekerja = '';
  for(let pi=0;pi<np;pi++){
    const nm=setup.pekerja[pi]?.nama||`P${pi+1}`;
    btnPekerja+=`<button onclick="openMatunMO(${t},${pi})"
      style="padding:6px 10px;background:#f5f3ff;border:1.5px solid #ddd6fe;border-radius:8px;
      font-size:12px;font-weight:700;color:#7C3AED;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px">
      <i class="ti ti-plus" style="font-size:13px"></i>${nm}</button>`;
  }

  let html=`
  <div style="margin-bottom:8px;display:flex;gap:6px;align-items:stretch">
    <select onchange="currentMonth=this.value;renderMatun(${t})" class="sel-month" style="flex:1">
      ${buildMonthOptsAbsen(currentMonth)}
    </select>
    ${t===4&&canEditLoc(4)?`<button class="btn-save" style="padding:0 12px;font-size:12px;border:none;cursor:pointer;white-space:nowrap" onclick="pushNav({title:'Bedeng Setup — Sawah Gondang',sub:'Konfigurasi bedeng',renderFn:renderBedengSetupSG,showBack:true})"><i class="ti ti-settings" aria-hidden="true"></i> Bedeng</button>`:''}
  </div>
  <div id="matun-sum-${t}" style="background:var(--orp);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap">
    <span>Kapasitas: <strong>${kap}</strong></span>
    <span>Sisa Bedeng: <strong style="color:var(--or)">${sisaTot}</strong></span>
    <span>Sisa: <strong style="color:${sisPct<20?'#c0392b':sisPct<50?'#b8820f':'#1a6b3c'}">${sisPct}%</strong></span>
  </div>
  <div style="margin-bottom:8px">
    <div style="font-size:10px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Input Cepat per Pekerja</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${btnPekerja}</div>
  </div>
  <div class="tbl-wrap"><table style="min-width:${70+np*180}px;table-layout:auto">
  <thead>
    <tr>
      <th class="td-sticky" rowspan="2" style="min-width:46px;z-index:3;font-size:9px">Tgl</th>
      ${thPekerja}
      <th rowspan="2" style="min-width:30px;font-size:9px">TOT</th>
      <th rowspan="2" style="min-width:34px;font-size:9px">Sisa%</th>
    </tr>
    <tr>`;
  for(let pi=0;pi<np;pi++){
    const isHybrid=pi<hc;
    html+=`<th style="font-size:9px;background:rgba(124,58,237,.55);min-width:40px">Luas</th>
           <th style="font-size:9px;background:rgba(124,58,237,.55);min-width:75px">Pekerjaan</th>
           <th style="font-size:9px;background:rgba(124,58,237,.55);min-width:75px">Ket</th>`;
    if(!isHybrid){
      html+=`<th style="font-size:9px;background:rgba(124,58,237,.4);min-width:30px">%</th>`;
    }
  }
  html+=`</tr></thead><tbody>`;

  days.forEach(({d,day})=>{
    const we=day===0||day===6;
    let totHarian=0;
    let rowHtml=`<tr>
      <td class="td-sticky" style="${we?'background:#fdf8f5;':''}font-weight:600;font-size:10px;white-space:nowrap">${d}/${m}</td>`;

    for(let pi=0;pi<np;pi++){
      const isHybrid=pi<hc;
      const kLuas=`MT-${currentMonth}-${t}-${d}-${pi}`;
      const kPek=`MT-${currentMonth}-${t}-${d}-${pi}-pek`;
      const kKet=`MT-${currentMonth}-${t}-${d}-${pi}-ket`;
      const luas=parseFloat(matunData[t][kLuas]||0);
      const pek=matunData[t][kPek]||'';
      const ket=matunData[t][kKet]||'';
      totHarian+=luas;

      rowHtml+=`<td style="padding:2px">
        <input type="number" value="${luas||''}" placeholder="0" step="0.1"
          style="width:100%;min-width:36px;border:1px solid var(--b);border-radius:5px;padding:2px 4px;font-size:11px;background:var(--bg);color:var(--t);text-align:center"
          onchange="matunData[${t}]['${kLuas}']=this.value;updateMatunSummary(${t})">
      </td>
      <td style="padding:2px">
        <input type="text" value="${pek.replace(/'/g,"&#39;")}" placeholder="Pekerjaan"
          style="width:100%;min-width:70px;border:1px solid var(--b);border-radius:5px;padding:2px 4px;font-size:11px;background:var(--bg);color:var(--t)"
          onchange="matunData[${t}]['${kPek}']=this.value">
      </td>
      <td style="padding:2px">
        <input type="text" value="${ket.replace(/'/g,"&#39;")}" placeholder="Ket"
          style="width:100%;min-width:70px;border:1px solid var(--b);border-radius:5px;padding:2px 4px;font-size:11px;background:var(--bg);color:var(--t)"
          onchange="matunData[${t}]['${kKet}']=this.value">
      </td>`;

      if(!isHybrid){
        const akum=getAkumLuas(pi,d);
        const luasBag=setup.pekerja[pi]?.luas||0;
        const sisa=luasBag-akum;
        const pct=luasBag>0?Math.round((sisa/luasBag)*100):0;
        rowHtml+=`<td style="font-weight:700;color:${pct<20?'#c0392b':pct<50?'#b8820f':'#1a6b3c'};font-size:10px;text-align:center;min-width:30px">${luasBag?pct+'%':''}</td>`;
      }
    }
    const sisaD=getSisaTotal(d);
    const sisPctD=kap>0?Math.round((sisaD/kap)*100):0;
    rowHtml+=`<td style="font-weight:700;color:var(--or);text-align:center;font-size:11px">${totHarian||''}</td>
              <td style="font-weight:700;color:${sisPctD<20?'#c0392b':sisPctD<50?'#b8820f':'#1a6b3c'};text-align:center;font-size:10px">${kap?sisPctD+'%':''}</td>
              </tr>`;
    html+=rowHtml;
  });

  html+=`</tbody></table></div>`;
  document.getElementById('MC').innerHTML=html;
  mcScrollSet(_sl);
  applyReadOnlyGuard();
}

  const [y,m] = currentMonth.split('-').map(Number);
  const mm = String(m).padStart(2,'0');
  const days = getDays(currentMonth);
  const todayD = new Date().getDate();

  const maxDate = `${y}-${mm}-${String(days[days.length-1].d).padStart(2,'0')}`;

  const kL0 = `MT-${currentMonth}-${t}-${d0}-${pi}`;

  document.getElementById('mo-body').innerHTML=`

      <input class="fi2" type="date" id="mt-tgl" min="${minDate}" max="${maxDate}" value="${defDate}"
        onchange="prefillMatunFields(${t},${pi},this.value)">
    </div>
    <div class="fg2"><label>Luas (bedeng)</label>
      <input class="fi2" type="number" id="mt-luas" placeholder="0" step="0.1" value="${matunData[t][kL0]||''}">
    </div>
    <div class="fg2"><label>Pekerjaan</label>
      <input class="fi2" type="text" id="mt-pek" placeholder="cth: Matun baris 1-3" value="${matunData[t][kP0]||''}">
